<meta charset="UTF-8">

<title>Customer Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#ff7043,#e65100);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:20px;padding:32px 24px;max-width:360px;width:100%;text-align:center}
.box h1{font-size:24px;color:#e65100;margin-bottom:8px}
.box p{font-size:14px;color:#888;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:30px;font-weight:bold;font-size:16px;margin-bottom:10px;cursor:pointer}
.btn-back{background:#f5f5f5;color:#666}
</style>
</head>
<body>
<div class="box">
<h1>Login</h1>
<p>mera ghar and world</p>

<!-- Profile (login hone par dikhega) -->
<div id="profileBox" style="display:none;text-align:center;">
  <div id="pfAvatar" style="width:90px;height:90px;border-radius:50%;background:#ffe0b2;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;">👤</div>
  <div id="pfName" style="font-size:22px;font-weight:bold;color:#333;"></div>
  <div id="pfPhone" style="font-size:15px;color:#e65100;margin:4px 0 16px;"></div>
  <button id="pfLogoutBtn" style="background:#f44336;color:#fff;border:none;padding:14px;width:100%;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;">🚪 Logout</button>
</div>

<!-- Gmail form (logout hone par dikhega) -->
<div id="gmailBox"><span id="loginBtn" style="display:none"></span></div>

<button class="btn btn-back" onclick="location.href='index.html'" style="margin-top:10px;">Wapas</button>
<div style="background:#e8f5e9;border-radius:10px;padding:10px;font-size:12px;color:#2e7d32;margin-top:12px;text-align:left;">🔒 <b>Safe hai!</b><br>Gmail se login karo — data har phone me milega! ✅</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// Login hai to PROFILE dikhao, nahi to Gmail form
(function(){
  var loggedIn = false;
  try{ loggedIn = localStorage.getItem("customer_logged_in")==="1"; }catch(e){}
  var gmailBox = document.getElementById("gmailBox");
  var profileBox = document.getElementById("profileBox");
  if(loggedIn){
    if(gmailBox) gmailBox.style.display = "none";
    if(profileBox){
      profileBox.style.display = "block";
      var d = null, l = null;
      try{ d = JSON.parse(localStorage.getItem("customer_profile") || "null"); }catch(e){}
      try{ l = JSON.parse(localStorage.getItem("customer_login") || "null"); }catch(e){}
      var nm = (d && d.profileName) || (l && l.name) || "";
      var ph = (d && d.profilePhone) || (l && l.phone) || "";
      var photo = (d && (d.profilePhoto || d.photo)) || "";
      document.getElementById("pfName").textContent = nm || "Mehmaan";
      document.getElementById("pfPhone").textContent = ph ? "📱 " + ph : "";
      if(photo){
        var av = document.getElementById("pfAvatar");
        av.textContent = "";
        var img = document.createElement("img");
        img.src = photo;
        img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
        av.appendChild(img);
      }
    }
  } else {
    if(profileBox) profileBox.style.display = "none";
    if(gmailBox) gmailBox.style.display = "block";
  }
})();
</script>
<script src="auth.js"></script>
<script>
// Fallback: agar 2 second me form na bane to khud banao / error dikhao
setTimeout(function(){
  if(document.getElementById("authCardInner")) return;
  var gb = document.getElementById("gmailBox");
  if(!gb || gb.style.display === "none") return;
  if(typeof window.showLogin === "function"){
    gb.innerHTML = '<div style="display:flex;justify-content:center;"><div id="authCardInner" style="width:340px;max-width:95%;"></div></div>';
    window.showLogin();
  } else {
    gb.innerHTML = '<div style="color:#d32f2f;font-size:14px;padding:20px;">⚠️ auth.js load nahi hui!<br>Check karo auth.js file customerlogin.html wale folder me hai.</div>';
  }
}, 2000);
</script>
</body>
</html>
