<script>
// UPDATE: Login hai to PROFILE dikhao - par SIRF current auth_uid wala
(function(){
  function showProfile(nm, ph, photo){
    try{ if(nm) localStorage.setItem("customer_name", nm); if(ph) localStorage.setItem("customer_phone", ph); if(photo) localStorage.setItem("customer_photo", photo); }catch(e){}
    // UPDATE: pehle nm || "Mehmaan" tha, isliye naam na milte hi Mehmaan dikh jata tha. Ab Load dikhega.
    document.getElementById("pfName").textContent = nm || "⏳ Naam load ho raha hai...";
    document.getElementById("pfPhone").textContent = ph ? "📱 " + ph : "";
    if(photo){
      var av = document.getElementById("pfAvatar");
      av.textContent = "";
      var img = document.createElement("img");
      img.src = photo;
      img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover";
      av.appendChild(img);
    }
  }
  var loggedIn = false;
  try{ loggedIn = localStorage.getItem("customer_logged_in")==="1"; }catch(e){}
  var gmailBox = document.getElementById("gmailBox");
  var profileBox = document.getElementById("profileBox");
  if(loggedIn){
    if(gmailBox) gmailBox.style.display = "none";
    if(profileBox){
      profileBox.style.display = "block";
      var curUid = "";
      try{ curUid = localStorage.getItem("auth_uid") || ""; }catch(e){}
      try{ if(window.firebase && firebase.auth && firebase.auth().currentUser) curUid = firebase.auth().currentUser.uid || curUid; }catch(e){}
      var d = null, l = null;
      try{ d = JSON.parse(localStorage.getItem("customer_profile") || "null"); }catch(e){}
      try{ l = JSON.parse(localStorage.getItem("customer_login") || "null"); }catch(e){}
      var localOk = false;
      if(d && curUid && d._uid && d._uid === curUid) localOk = true;
      if(d && !d._uid && !curUid) localOk = true;
      if(localOk){
        showProfile((d && d.profileName) || (l && l.name) || "", (d && d.profilePhone) || (l && l.phone) || "", (d && (d.profilePhoto || d.photo)) || "");
      } else {
        // UPDATE: pehle yahan showProfile("","","") tha jo Mehmaan dikha deta tha. Ab Load dikhao, Firebase se aane do.
        document.getElementById("pfName").textContent = "⏳ Naam load ho raha hai...";
      }
      if(curUid && (window._fbDb || (window.firebase && firebase.database && firebase.database()))){ var _fbDb = window._fbDb || firebase.database();
        _fbDb.ref("customer_profiles/" + curUid).once("value").then(function(s){
          var P = s.val() || {};
          var nm = P.profileName || P.name || P.customer_name || "";
          var ph = P.profilePhone || P.phone || "";
          var photo = P.profilePhoto || P.photo || "";
          if(nm || photo){ try{ localStorage.setItem("customer_logged_in","1"); if(curUid) localStorage.setItem("auth_uid", curUid); }catch(e){} showProfile(nm, ph, photo); }
          else {
            // Firebase me naam hi nahi hai - to Gmail wale naam se dikhao, Mehmaan nahi
            try{
              var gName = localStorage.getItem("customer_name") || (firebase.auth().currentUser && firebase.auth().currentUser.displayName) || "";
              var gPhoto = localStorage.getItem("customer_photo") || (firebase.auth().currentUser && firebase.auth().currentUser.photoURL) || "";
              if(gName || gPhoto) showProfile(gName, "", gPhoto);
            }catch(e){}
          }
        });
      }
    }
  } else {
    if(profileBox) profileBox.style.display = "none";
    if(gmailBox) gmailBox.style.display = "block";
  }
  var lb = document.getElementById("pfLogoutBtn");
  if(lb){
    lb.onclick = function(){
      ["customer_profile","customer_login","customer_name","customer_username","customer_phone","customer_photo","my_profile","auth_uid"].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} });
      try{ localStorage.setItem("customer_logged_in","0"); }catch(e){}
      try{ if(window.firebase && firebase.auth) firebase.auth().signOut(); }catch(e){}
      location.reload();
    };
  }
})();
</script>
<script src="auth.js"></script>
<script>
setTimeout(function(){
  if(document.getElementById("authCardInner")) return;
  var gb = document.getElementById("gmailBox");
  if(!gb || gb.style.display === "none") return;
  if(typeof window.showLogin === "function"){
    gb.innerHTML = '<div style="display:flex;justify-content:center;"><div id="authCardInner" style="width:340px;max-width:95%;"></div></div>';
    window.showLogin();
  } else {
    gb.innerHTML = '<div style="color:#d32f2f;font-size:14px;padding:20px;">⚠️ auth.js load nahi hui!<br>Check karo auth.js file customerlogin.html wale folder me hai.</div>';
  }
}, 2000);
</script>
<script>
// UPDATE: Gmail login hote hi auth_uid + naam save karo, reload ka wait mat karo
// UPDATE: pehle yahan Mehmaan dekh ke location.reload() tha, isliye baar-baar reload hota tha. Ab reload nahi hoga.
try{
  if(window.firebase && firebase.auth){
    firebase.auth().onAuthStateChanged(function(u){
      if(u && u.uid){
        try{
          if(!localStorage.getItem("auth_uid")) localStorage.setItem("auth_uid", u.uid);
          localStorage.setItem("customer_logged_in","1");
          if(u.displayName && !localStorage.getItem("customer_name")) localStorage.setItem("customer_name", u.displayName);
          if(u.photoURL && !localStorage.getItem("customer_photo")) localStorage.setItem("customer_photo", u.photoURL);
        }catch(e){}
        try{
          var pn=document.getElementById("pfName");
          var pb=document.getElementById("profileBox");
          if(pn && pb && pb.style.display!=="none" && (!pn.textContent || pn.textContent.indexOf("load ho raha")!==-1)){
            var gN = u.displayName || localStorage.getItem("customer_name") || "";
            if(gN) pn.textContent = gN;
          }
        }catch(e){}
      }
    });
  }
}catch(e){}
</script>
