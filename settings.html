<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

<header id="hdr"><a class="backbtn" href="friends.html">← Wapas</a><div style="flex:1;text-align:center;font-weight:bold">⚙️ Settings - Activity</div><div style="width:70px"></div></header>
<div class="wrap">
<h1>📋 Meri Activity - Date Wise</h1><div class="sub">Added / Reject / Block / Recycle / Chat / Profile / Album / Timeline - sab yahan</div>
<div class="sum"><div><b id="cAdded">0</b><span>Added Friend</span></div><div><b id="cBlocked">0</b><span>Blocked</span></div><div><b id="cRecycle">0</b><span>Recycle</span></div></div>
<div class="tabs">
<button style="background:#4caf50" onclick="setFilter('all',this)" class="on">📋 Sab</button>
<button style="background:#4caf50" onclick="setFilter('added',this)">✅ Added</button>
<button style="background:#f44336" onclick="setFilter('rejected',this)">❌ Reject</button>
<button style="background:#000" onclick="setFilter('blocked',this)">🚫 Block</button>
<button style="background:#ff9800" onclick="setFilter('recycle',this)">♻️ Recycle</button>
<button style="background:#2196F3" onclick="setFilter('chat',this)">💬 Chat</button>
<button style="background:#7b1fa2" onclick="setFilter('profile',this)">👤 Profile/Album</button>
</div>
<div id="activityList"><div class="empty">⏳ Activity load ho rahi hai...</div></div>
</div>
<script>
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getMyUid(){try{return localStorage.getItem("auth_uid")||localStorage.getItem("customer_phone")||"";}catch(e){return "";}}
function getMyName(){try{return localStorage.getItem("customer_name")||"Me";}catch(e){return "Me";}}
function fmtDT(ts){try{var d=new Date(ts||Date.now());var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];var h=d.getHours();var ap=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;return d.getDate()+" "+mo[d.getMonth()]+" "+d.getFullYear()+", "+h+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap;}catch(e){return "";}}
function dateKey(ts){var d=new Date(ts||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateLabel(ts){var d=new Date(ts||Date.now());var t=new Date();var y=new Date();y.setDate(y.getDate()-1);if(dateKey(ts)===dateKey(t))return "📅 Aaj - "+fmtDT(ts).split(",")[0];if(dateKey(ts)===dateKey(y))return "📅 Kal - "+fmtDT(ts).split(",")[0];return "📅 "+fmtDT(ts).split(",")[0];}
var MY_UID=getMyUid();
var ALL=[]; var FILTER="all";
function addItem(type,icon,title,ts,extra){ ALL.push({type:type,icon:icon,title:title,ts:ts||0,extra:extra||{}}); }
function readLocal(key,def){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(def));}catch(e){return def;}}
function loadLocalActivity(){
  // Local se: Blocked, Deleted (Recycle), Rejected, Added
  readLocal("fr_blocked",[]).forEach(function(nm){ addItem("blocked","🚫","Block kiya - "+nm,0,{name:nm}); });
  readLocal("fr_deleted",[]).forEach(function(m){ addItem("recycle","♻️","Chat delete hua - "+(m.withName||m.text||"").toString().slice(0,30),m.deletedTime||m.ts||0,{msg:m}); });
  readLocal("fr_rejected",[]).forEach(function(r){ var nm=(typeof r==="string")?r:(r.name||""); addItem("rejected","❌","Request Reject ki - "+nm, (r&&r.time)||0, {name:nm}); });
  readLocal("fr_myfriends",[]).forEach(function(nm){ addItem("added","✅","Dost bana - "+nm,0,{name:nm}); });
  // Chat exports (Gmail bheja)
  if(_fbDb&&MY_UID){ _fbDb.ref("chat_exports/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){var e=s.val()[k]; addItem("chat","📧","Chat Gmail par bheja - "+(e.with||""),e.time||0,{}); }); render(); }).catch(function(){}); }
}
function loadFirebaseActivity(){
  if(!_fbDb||!MY_UID){ render(); return; }
  var jobs=[];
  jobs.push(_fbDb.ref("friends/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(uid){var v=s.val()[uid]||{}; addItem("added","✅","Dost bana - "+(v.name||""),v.time||0,{uid:uid,name:v.name||""}); }); }).catch(function(){}));
  jobs.push(_fbDb.ref("blocked/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(uid){var v=s.val()[uid]||{}; addItem("blocked","🚫","Block kiya - "+(v.name||""),v.time||0,{uid:uid,name:v.name||""}); }); }).catch(function(){}));
  jobs.push(_fbDb.ref("friend_requests_sent/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(uid){var v=s.val()[uid]||{}; addItem("chat","📤","Request bheji - "+(v.name||""),v.time||0,{uid:uid}); }); }).catch(function(){}));
  jobs.push(_fbDb.ref("recycle_bin/"+MY_UID).once("value").then(function(s){ var v=s.val()||{}; Object.keys(v).forEach(function(fid){ Object.keys(v[fid]||{}).forEach(function(mid){ var m=v[fid][mid]||{}; addItem("recycle","♻️","Chat delete hua - "+(m.withName||"")+" : "+String(m.text||"").slice(0,30),m.deletedTime||m.ts||0,{msg:m,fid:fid}); }); }); }).catch(function(){}));
  jobs.push(_fbDb.ref("customer_profiles/"+MY_UID).once("value").then(function(s){ var P=s.val()||{}; if(P.profileName||P.name){ addItem("profile","👤","Profile save hua - "+(P.profileName||P.name||""),P.updatedAt||P.profileUpdatedAt||0,{}); } var alb=P.album||P.photos||[]; if(alb.length) addItem("profile","📸","Album me "+alb.length+" photos hain",(P.albumUpdatedAt||0),{}); var tl=P.timeline||P.posts||[]; if(tl.length) addItem("profile","📅","Timeline me "+tl.length+" entries hain",(P.timelineUpdatedAt||0),{}); }).catch(function(){}));
  Promise.all(jobs).then(function(){ render(); });
}
function setFilter(f,btn){ FILTER=f; document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on');}); if(btn) btn.classList.add('on'); render(); }
function render(){
  // Dedupe: same type+title+ts ek baar
  var seen={}; var arr=[]; ALL.forEach(function(a){ var k=a.type+"|"+a.title+"|"+a.ts; if(seen[k]) return; seen[k]=true; arr.push(a); });
  // Counts
  document.getElementById('cAdded').textContent = arr.filter(function(a){return a.type==="added";}).length;
  document.getElementById('cBlocked').textContent = arr.filter(function(a){return a.type==="blocked";}).length;
  document.getElementById('cRecycle').textContent = arr.filter(function(a){return a.type==="recycle";}).length;
  var list=arr.filter(function(a){ return FILTER==="all"||a.type===FILTER; });
  list.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  var box=document.getElementById('activityList');
  if(!list.length){ box.innerHTML='<div class="empty">Isme abhi kuch nahi hai 👍</div>'; return; }
  var html=""; var lastDate="";
  list.forEach(function(a,i){
    var dk=a.ts? dateKey(a.ts) : "nodate";
    if(dk!==lastDate){ html+='<div class="dateHead">'+(a.ts? dateLabel(a.ts) : "📅 Purana Data (date nahi hai)")+'</div>'; lastDate=dk; }
    var btn="";
    if(a.type==="blocked"&&a.extra.uid){ btn='<button style="background:#4caf50;color:#fff" onclick="unblockUid(\''+a.extra.uid+'\',\''+esc(a.extra.name||"")+'\')">✅ Unblock</button>'; }
    if(a.type==="recycle"&&a.extra.msg){ btn='<button style="background:#4caf50;color:#fff" onclick="restoreMsg(\''+esc(a.extra.fid||"")+'\',\''+esc(a.extra.msg.id||"")+'\')">↩️ Wapas Lao</button>'; }
    html+='<div class="card"><div class="ic">'+a.icon+'</div><div class="tx"><div class="tt">'+esc(a.title)+'</div><div class="dt">'+(a.ts? fmtDT(a.ts) : "Date save nahi thi - purana data")+'</div></div>'+btn+'</div>';
  });
  box.innerHTML=html;
}
function unblockUid(uid,name){
  if(!confirm((name||"")+" ko Unblock karein?")) return;
  if(_fbDb&&MY_UID) _fbDb.ref("blocked/"+MY_UID+"/"+uid).remove();
  var bl=readLocal("fr_blocked",[]).filter(function(x){return x!==name;}); localStorage.setItem("fr_blocked",JSON.stringify(bl));
  ALL=ALL.filter(function(a){return !(a.type==="blocked"&&a.extra.uid===uid);});
  render(); alert("✅ Unblock ho gaya");
}
function restoreMsg(fid,mid){
  if(!_fbDb||!MY_UID){ alert("Pehle login karo"); return; }
  _fbDb.ref("recycle_bin/"+MY_UID+"/"+fid+"/"+mid).once("value").then(function(s){
    var m=s.val(); if(!m){ alert("Recycle me nahi mila"); return; }
    var nm={id:m.id,me:(m.fromUid===MY_UID),type:m.type||"text",text:m.text||"",fname:m.fname||"",time:m.time||fmtDT(m.ts),ts:m.ts||Date.now(),fromUid:m.fromUid||MY_UID,fromName:m.fromName||getMyName(),toUid:fid,toName:m.withName||""};
    _fbDb.ref("chats/"+MY_UID+"/"+fid+"/"+mid).set(nm);
    _fbDb.ref("chats/"+fid+"/"+MY_UID+"/"+mid).set(nm);
    _fbDb.ref("recycle_bin/"+MY_UID+"/"+fid+"/"+mid).remove();
    var del=readLocal("fr_deleted",[]).filter(function(x){return x.id!==mid;}); localStorage.setItem("fr_deleted",JSON.stringify(del));
    ALL=ALL.filter(function(a){return !(a.type==="recycle"&&a.extra.msg&&a.extra.msg.id===mid);});
    render(); alert("✅ Wapas aa gaya!");
  });
}
loadLocalActivity(); loadFirebaseActivity();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
