body{background:#fff8f0;color:#333}

.pphone{color:#e65100;font-size:16px;margin-top:4px}
.status-bubble{display:inline-block;background:#e8f5e9;border-radius:20px;padding:8px 16px;margin:10px 0;font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tab{background:#f5f5f5;border-radius:16px;padding:6px 14px;font-size:13px;font-weight:bold;cursor:pointer;border:none}
.pbtn{display:block;width:100%;padding:14px;border:none;border-radius:30px;font-weight:bold;font-size:16px;margin-top:10px;color:#fff;cursor:pointer;text-decoration:none;box-sizing:border-box;text-align:center}
.bigbtn{display:block;width:100%;padding:15px;border:none;font-weight:bold;font-size:17px;color:#fff;cursor:pointer;text-decoration:none;text-align:center;box-sizing:border-box}
.backbtn{background:#fff;border:2px solid #e65100;color:#e65100;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}
.entry{background:#fff8f0;border-radius:10px;padding:10px;margin-top:8px;font-size:13px;text-align:left}
.entry .edt{color:#e65100;font-weight:bold}
.thinkbox{background:#fffbe6;border-left:4px solid #ffc107;padding:10px;border-radius:0 10px 10px 0;margin-top:8px;text-align:left;font-size:13px}
.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:15px;box-sizing:border-box}
textarea.inp{resize:vertical;min-height:80px}
.msgsec{text-align:left;margin-top:12px;border-top:1px solid #eee;padding-top:12px}
.msgsec h3{color:#e65100;font-size:17px}
</style>

<script>
var FIREBASE_CONFIG = { apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA", authDomain: "santramarketshoppingmall.firebaseapp.com", databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com", projectId: "santramarketshoppingmall", storageBucket: "santramarketshoppingmall.firebasestorage.app", messagingSenderId: "398490252924", appId: "1:398490252924:web:4b6f73b48d28e1c23b7bf9" };
var _fbDb=null; try{ firebase.initializeApp(FIREBASE_CONFIG); _fbDb=firebase.database(); }catch(e){}
function getUid(){ var m=location.search.match(/[?&]uid=([^&]+)/); if(m) return decodeURIComponent(m[1]); m=location.search.match(/[?&]cid=([^&]+)/); return m?decodeURIComponent(m[1]):""; }

<div id="pcard"><div class="ptop"><div class="pphoto-big" id="bigPhoto">👩</div></div><div class="pbody" id="pbody"><div style="padding:20px;color:#999">⏳ Loading...</div></div></div>
<footer id="ftr"><b>Restro Apka | Pilibanga</b><br><br><a class="btn2" href="https://wa.me/918769171078">WhatsApp: 8769171078</a><br><br><span style="font-size:12px">meragharandworld.web.app</span></footer>

<script>
function esc(t){return String(t==null?"":t).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');}
function getProfile(){try{return JSON.parse(localStorage.getItem("my_profile")||"{}");}catch(e){return{};}}
function getLogin(){ try{ var lg=JSON.parse(localStorage.getItem("customer_login")||"null"); if(lg) return lg; var logged=localStorage.getItem("customer_logged_in"); var uname=localStorage.getItem("customer_username")||localStorage.getItem("customer_name")||""; var umob=localStorage.getItem("customer_mobile")||localStorage.getItem("customer_phone")||""; if(logged==="1" && (uname||umob)){ var obj={name:uname||"Manisha", phone:umob||""}; localStorage.setItem("customer_login", JSON.stringify(obj)); return obj; } var idxLogin=localStorage.getItem("auth_uid"); if(idxLogin){ var n=localStorage.getItem("customer_name")||uname||"Manisha"; var p=localStorage.getItem("customer_phone")||umob||""; return {name:n, phone:p}; } }catch(e){} return null; }
function getDetails(){try{return JSON.parse(localStorage.getItem("customer_details")||"[]");}catch(e){return[];}}
function getThinks(){try{return JSON.parse(localStorage.getItem("customer_thinkings")||"[]");}catch(e){return[];}}
function sendReq(uid,btn){ var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){} if(!myUid){ alert("Pehle login karo!"); location.href="customerlogin.html"; return; } if(!_fbDb){ alert("Firebase nahi"); return; } var myName="User"; try{myName=localStorage.getItem("customer_name")||localStorage.getItem("customer_username")||myUid;}catch(e){} _fbDb.ref("friend_requests/"+uid).push({fromUid:myUid,fromName:myName,time:Date.now(),status:"pending"},function(err){ if(!err){ btn.textContent="✅ Request Bheji!"; btn.disabled=true; btn.style.background="#999"; alert("✅ Request bhej di!"); } }); try{ _fbDb.ref("friend_requests_sent/"+myUid+"/"+uid).set({time:Date.now()}); }catch(e){} }
function renderFriend(uid){
  if(!_fbDb){ document.getElementById('pbody').innerHTML='<div style="padding:20px;">❌ Firebase nahi hai</div>'; return; }
  var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(myUid && myUid===uid){ renderOwn(); return; }
  document.getElementById('brand').textContent="👤 Friend ka Profile";
  document.getElementById('pbody').innerHTML='<div style="padding:20px;color:#999">⏳ Friend ka public data load ho raha hai...</div>';
  _fbDb.ref("customer_profiles/"+uid).once("value",function(snap){
    var P=snap.val();
    if(!P){ document.getElementById('pbody').innerHTML='<div style="padding:20px;">❌ User nahi mila</div>'; return; }
    var name=esc(P.profileName||P.name||"User");
    var phone=esc(P.profilePhone||P.phone||"");
    var detail=esc(P.profileDetail||P.status||P.detail||"");
    var photo=P.profilePhoto||P.photo||"";
    var bigPhoto=document.getElementById('bigPhoto');
    if(photo) bigPhoto.innerHTML='<img src="'+photo+'">';
    var pc=(P.extraPhotos||[]).length+(photo?1:0);
    document.getElementById('brand').textContent="👤 "+name+" ka Profile";
    var isPublic=true; try{ var priv=P.privacy||{}; if(priv.profilePublic===false) isPublic=false; }catch(e){}
    var h='';
    if(!isPublic){ h+='<div style="padding:20px;text-align:center;"><div style="font-size:48px;">🔒</div><b>Ye profile private hai</b><br><br>'+name+' ne apna profile public nahi kiya.<br><br><button class="pbtn" style="background:#25D366;" onclick="sendReq(\''+uid+'\',this)">📩 Friend Request Bhejo</button></div>'; document.getElementById('pbody').innerHTML=h; return; }
    h+='<div id="alreadyBox" style="display:none;background:#e8f5e9;color:#2e7d32;font-weight:bold;padding:12px;border-radius:12px;text-align:center;margin-bottom:10px;">✅ Already Friends - Mere Dost me hai</div>';
    h+='<button class="photosbtn" onclick="location.href=\'album.html?uid='+uid+'\'">📸 Friend Photos ('+pc+')</button>';
    h+='<div class="pname">'+name+'</div>'; if(phone) h+='<div class="pphone">📞 '+phone+'</div>'; if(detail) h+='<div style="margin-top:8px;font-size:14px;color:#666;text-align:left;background:#fff8f0;padding:10px;border-radius:10px;">'+detail+'</div>';
    h+='<div style="margin-top:14px;display:grid;gap:10px;">';
    h+='<button id="reqBtn" class="pbtn" style="background:#25D366;" onclick="sendReq(\''+uid+'\',this)">📩 Friend Request Bhejo - '+name+' ko</button>';
    h+='<a class="pbtn" style="background:#e65100;" href="friends.html?chat='+uid+'">💬 Chat Karo - '+name+' se</a>';
    h+='<a class="bigbtn" href="album.html?uid='+uid+'" style="background:#7b1fa2;">📸 Friend Album - '+name+' ka Album Dekho</a>';
    h+='<a class="bigbtn" href="timedatalist.html?uid='+uid+'" style="background:#2196F3;">📅 Friend Timeline - '+name+' ki Timeline Dekho</a>';
    h+='<a class="bigbtn" href="index.html?uid='+uid+'" style="background:#ff7043;">🏠 Friend Home - '+name+' ke Posts Dekho</a>';
    h+='</div>'; document.getElementById('pbody').innerHTML=h;
    if(myUid && _fbDb){ _fbDb.ref("friends/"+myUid+"/"+uid).once("value",function(s){ var reqBtn=document.getElementById("reqBtn"); var alreadyBox=document.getElementById("alreadyBox"); if(s.exists()){ if(reqBtn) reqBtn.style.display="none"; if(alreadyBox) alreadyBox.style.display="block"; } else { _fbDb.ref("friend_requests_sent/"+myUid+"/"+uid).once("value",function(s2){ if(s2.exists() && reqBtn){ reqBtn.textContent="📤 Request Bheji Hai - Wait Karo"; reqBtn.disabled=true; reqBtn.style.background="#999"; } }); } }); }
  });
}
function renderOwn(){
  var p=getProfile(); var login=getLogin(); var body=document.getElementById('pbody'); var bigPhoto=document.getElementById('bigPhoto');
  if(!login){ body.innerHTML='<div style="padding:20px;"><div style="font-size:20px;font-weight:bold;margin-bottom:10px;">🔐 Login Karo</div><p style="color:#888;font-size:14px;margin-bottom:12px;">Apna naam aur phone likho,<br>phir aapka profile dikhega</p><a class="pbtn" style="background:#7b1fa2;" href="customerlogin.html">🔐 Customer Login</a><br><a class="pbtn" style="background:#e65100;margin-top:10px;" href="editprofile.html">✏️ Profile Edit Karo</a></div>'; return; }
  var name=esc(p.name||login.name||"Manisha"); var phone=esc(p.phone||login.phone||"9660834888"); var status=esc(p.status||p.detail||"Hi"); var photoCount=(p.extraPhotos||[]).length+(p.photo?1:0); var details=getDetails(); var thinks=getThinks();
  if(p.photo) bigPhoto.innerHTML='<img src="'+p.photo+'">'; document.getElementById('brand').textContent="👤 Mera Profile - "+name;
  var h='<button class="photosbtn" onclick="location.href=\'album.html\'">📸 Photos Dekho ('+photoCount+')</button>'+'<div class="pname">'+name+'</div><div class="pphone">📞 '+phone+'</div>'+'<div><span class="status-bubble">🟢 '+status+'</span></div>';
  h+='<div style="text-align:center;margin-top:8px;"><a class="pbtn" style="background:#e65100;width:auto;display:inline-block;padding:12px 32px;" href="editprofile.html">✏️ Mera Profile Edit Karo</a></div>'+'<a class="pbtn" style="background:#7b1fa2;" href="friends.html">📩 Meri Friend Requests</a>'+'<button class="pbtn" style="background:#f44336;" onclick="logout()">🚪 Logout</button>'; body.innerHTML=h;
}
function logout(){ if(confirm("Logout?")){ try{ localStorage.removeItem("customer_logged_in"); localStorage.removeItem("auth_uid"); localStorage.removeItem("customer_login"); }catch(e){} location.href="customerlogin.html"; } }
var fid=getUid(); if(fid){ renderFriend(fid); } else { renderOwn(); }
</script>
