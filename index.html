// Image compress (Firebase limit ke liye)
function _compress(img,cb){var c=document.createElement('canvas');var w=img.width,h=img.height;var mx=500;
if(w>mx||h>mx){var r=Math.min(mx/w,mx/h);w=Math.round(w*r);h=Math.round(h*r);}
c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.6));}
function _fileToData(file,cb){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){_compress(img,cb);};img.src=rd.result;};rd.readAsDataURL(file);}

function _sendMsg(msg){if(!_curFi)return;
if(_fbDb&&_fbRef){_fbRef.push(msg);}
else{try{var k="frchat_"+_curFi;var v=localStorage.getItem(k);var a=v?JSON.parse(v):[];a.push(msg);localStorage.setItem(k,JSON.stringify(a.slice(-200)));_renderMsgs(a);}catch(e){}}}

// Full page kholo

bh+='</div>';
document.getElementById('frPageBody').innerHTML=bh;
_startChat(f);
document.getElementById('frPage').style.display="block";
document.body.style.overflow="hidden";}
