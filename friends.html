*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#333}
#hdr{background:#fff;padding:12px 16px;display:flex;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
#brand{font-size:20px;font-weight:bold;color:#000;flex:1}
.backbtn{background:#fff;border:2px solid #e65100;color:#e65100;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}
#hero{background:linear-gradient(135deg,#ff7043,#e65100);color:#fff;padding:30px 20px;text-align:center}
#hero h1{font-size:28px;margin-bottom:6px}
#hero p{font-size:14px}
#searchWrap{padding:16px 20px 0;max-width:560px;margin:0 auto}
#frSearch{width:100%;padding:12px 16px;border:2px solid #e65100;border-radius:24px;font-size:15px;box-sizing:border-box;outline:none}
#frSearch:focus{border-color:#ff7043;box-shadow:0 0 8px rgba(230,81,0,.2)}
.hint{text-align:center;font-size:11px;color:#999;margin-top:6px}
.sec{padding:10px 20px;max-width:560px;margin:0 auto}
.sec h2{color:#e65100;text-align:center;margin:16px 0 12px;font-size:22px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fcard{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.fcard .fp{width:64px;height:64px;border-radius:50%;background:#ffe0b2;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 8px;overflow:hidden}
.fcard .fp img{width:100%;height:100%;object-fit:cover}
.fcard .fn{font-weight:bold;font-size:15px}
.fcard .fr{color:#e65100;font-size:13px;font-weight:bold}
.fcard .fd{font-size:11px;color:#777;margin-top:6px}
.fcard .tap{font-size:11px;color:#999;margin-top:6px}
.mycard{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px}
.mycard .fp{width:52px;height:52px;border-radius:50%;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.mycard .fp img{width:100%;height:100%;object-fit:cover}
.mycard .info{flex:1}
.mycard .fn{font-weight:bold;font-size:15px}
.mycard .st{font-size:12px;color:#4caf50}
.chatbtn{background:#25D366;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px}
.reqcard{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;border-left:4px solid #ff9800}
.reqcard .fp{width:52px;height:52px;border-radius:50%;background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.reqcard .info{flex:1}
.reqcard .fn{font-weight:bold;font-size:15px}
.reqcard .tm{font-size:11px;color:#999}
.accbtn{background:#4caf50;color:#fff;border:none;padding:8px 16px;border-radius:18px;font-weight:bold;cursor:pointer;font-size:13px;margin-right:6px}
.rejbtn{background:#f44336;color:#fff;border:none;padding:8px 16px;border-radius:18px;font-weight:bold;cursor:pointer;font-size:13px}
.sendbtn{background:#e65100;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px;width:100%;margin-top:8px}
.empty{text-align:center;color:#999;padding:20px;font-size:14px}
#ftr{background:#4e342e;color:#fff;text-align:center;padding:24px 16px;margin-top:20px}
#ftr a{color:#ffcc80}
/* Friend Detail Page */
#detailPage,#chatPage{padding:16px;max-width:600px;margin:0 auto;display:none}
.detail-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center}
.detail-card .bigphoto{width:100px;height:100px;border-radius:50%;background:#ffe0b2;display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto 12px;overflow:hidden}
.detail-card .bigphoto img{width:100%;height:100%;object-fit:cover}
.detail-card h2{font-size:22px;margin-bottom:4px}
.detail-card .role{color:#e65100;font-weight:bold;margin-bottom:10px}
.detail-card .desc{font-size:14px;color:#666;text-align:left;margin:12px 0;line-height:1.6}
/* Chat */
.chat-head{background:#e65100;color:#fff;padding:12px 16px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:10px}
.chat-head .fp{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.chat-head .nm{font-weight:bold;flex:1}
#chatMsgs{background:#fff;height:300px;overflow-y:auto;padding:12px;border-left:1px solid #eee;border-right:1px solid #eee}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;word-wrap:break-word}
.msg.me{background:#dcf8c6;margin-left:auto;text-align:right}
.msg.them{background:#f1f1f1;margin-right:auto}
.msg img{max-width:100%;border-radius:8px;margin-top:4px}
.msg .tm{font-size:10px;color:#999;margin-top:4px}
.chat-input{display:flex;gap:8px;padding:10px;background:#fff;border-radius:0 0 12px 12px;border:1px solid #eee;border-top:none}
.chat-input input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none;font-size:14px}
.attachbtn{background:#fff;border:1px solid #ddd;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px;flex-shrink:0}
.sendchatbtn{background:#25D366;color:#fff;border:none;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px;flex-shrink:0}
.hidden{display:none!important}

<script>
// ===== DOSTON KA DATA (yahan apne dost add karo) =====
// ===== DEMO FRIENDS (sirf tumko dikhenge) =====
var DEMO_FRIENDS = [
{photo:"👦", name:"Rahul", role:"Chef", detail:"Rahul hamara best chef hai. 5 saal se kaam kar raha hai."},
{photo:"👧", name:"Priya", role:"Manager", detail:"Priya sab manage karti hai. Bahut smart hai."},
{photo:"👨", name:"Amit", role:"Delivery Boy", detail:"Amit tez delivery karta hai. Sabka favourite."},
{photo:"👩", name:"Sneha", role:"Waiter", detail:"Sneha customers ko bahut achhe se handle karti hai."},
{photo:"🧑", name:"Vikash", role:"Cook", detail:"Vikash ke haath ka khana sabko pasand hai."},
{photo:"👴", name:"Ramesh", role:"Helper", detail:"Ramesh ji sabki madad karte hain."}
];
var FRIENDS = DEMO_FRIENDS.slice();

// ===== REAL FRIENDS FROM FIREBASE =====
function loadRealFriends(){
  if(!window._fbDb) return;
  window._fbDb.ref("customer_profiles").once("value", function(snap){
    var realList = [];
    snap.forEach(function(ch){
      var u = ch.val();
      var nm = u.profileName || u.name || "";
      if(!nm) return;
      realList.push({
        photo: u.profilePhoto
          ? '<img src="'+u.profilePhoto+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
          : "👤",
        name: nm,
        role: u.profilePhone || u.phone || "",
        detail: (u.profileDetail || "") + "<br>📞 " + (u.profilePhone || u.phone || "")
      });
    });
    // Apna khud ka naam hatao
    var myLogin = null;
    try{ myLogin = JSON.parse(localStorage.getItem("customer_login")||"null"); }catch(e){}
    var myName = (myLogin && myLogin.name || "").toLowerCase();
    // Sirf tumko (Manisha) demo dikhega
    var isOwner = myName === "manisha";
    if(isOwner){
      FRIENDS = DEMO_FRIENDS.concat(realList);
    } else {
      FRIENDS = realList;
    }
    // Apna naam list se hatao
    if(myName){
      FRIENDS = FRIENDS.filter(function(f){ return f.name.toLowerCase() !== myName; });
    }
    renderFriends(document.getElementById('frSearch').value || "");
    renderMyFriends();
    renderRequests();
  });
}
setTimeout(loadRealFriends, 1500);




  
// ===== LOCALSTORAGE KEYS =====
function getRequests(){ try{return JSON.parse(localStorage.getItem("fr_requests")||"[]");}catch(e){return[];} }
function saveRequests(r){ localStorage.setItem("fr_requests", JSON.stringify(r)); }
function getMyFriends(){ try{return JSON.parse(localStorage.getItem("fr_myfriends")||"[]");}catch(e){return[];} }
function saveMyFriends(f){ localStorage.setItem("fr_myfriends", JSON.stringify(f)); }
function getChats(){ try{return JSON.parse(localStorage.getItem("fr_chats")||"{}");}catch(e){return{};} }
function saveChats(c){ localStorage.setItem("fr_chats", JSON.stringify(c)); }

// ===== RENDER ALL FRIENDS =====
function renderFriends(filter){
  var grid = document.getElementById('friendsGrid');
  var html = "";
  var q = (filter||"").toLowerCase();
  var myF = getMyFriends();
  var reqs = getRequests();
  
  FRIENDS.forEach(function(f, i){
    if(q && f.name.toLowerCase().indexOf(q) === -1) return;
    var isFriend = myF.indexOf(f.name) !== -1;
    var hasReq = reqs.some(function(r){return r.name === f.name;});
    var badge = "";
    if(isFriend) badge = '<div style="font-size:11px;color:#4caf50;font-weight:bold;margin-top:4px;">✅ Dost</div>';
    else if(hasReq) badge = '<div style="font-size:11px;color:#ff9800;font-weight:bold;margin-top:4px;">⏳ Request bheji</div>';
    
    html += '<div class="fcard" onclick="openDetail('+i+')">'
      + '<div class="fp">'+f.photo+'</div>'
      + '<div class="fn">'+f.name+'</div>'
      + '<div class="fr">'+f.role+'</div>'
      + badge
      + '<div class="tap">Tap karo 👆</div></div>';
  });
  
  grid.innerHTML = html || '<div class="empty">Koi dost nahi mila. Dusra naam try karo!</div>';
}

// ===== RENDER MY FRIENDS (ACCEPTED) =====
function renderMyFriends(){
  var list = document.getElementById('myFriendsList');
  var myF = getMyFriends();
  var sec = document.getElementById('myFriendsSec');
  
  if(myF.length === 0){
    sec.style.display = "none";
    return;
  }
  sec.style.display = "block";
  
  var html = "";
  myF.forEach(function(name){
    var f = FRIENDS.find(function(x){return x.name === name;});
    var photo = f ? f.photo : "👤";
    var role = f ? f.role : "";
html += '<div class="mycard">'
    + '<div style="display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;" onclick="openDetailByName(\''+name+'\')">'
    + '<div class="fp">'+photo+'</div>'
    + '<div class="info"><div class="fn">'+name+'</div><div class="st">✅ Dost • '+role+'</div></div>'
    + '</div>'
    + '<button class="chatbtn" onclick="openChat(\''+name+'\')">💬 Chat</button>'
    + '</div>';
  });
  list.innerHTML = html;
}

// ===== RENDER REQUESTS =====
function renderRequests(){
  var list = document.getElementById('reqList');
  var reqs = getRequests();
  var sec = document.getElementById('reqSec');
  
  if(reqs.length === 0){
    sec.style.display = "none";
    return;
  }
  sec.style.display = "block";
  
  var html = "";
  reqs.forEach(function(r, i){
    var f = FRIENDS.find(function(x){return x.name === r.name;});
    var photo = f ? f.photo : "👤";
    html += '<div class="reqcard">'
      + '<div class="fp">'+photo+'</div>'
      + '<div class="info"><div class="fn">'+r.name+'</div><div class="tm">📩 '+r.time+'</div></div>'
      + '<div><button class="accbtn" onclick="acceptReq('+i+')">✅ Accept</button>'
      + '<button class="rejbtn" onclick="rejectReq('+i+')">❌</button></div>'
      + '</div>';
  });
  list.innerHTML = html;
}

// ===== FILTER =====
function filterFriends(q){
  renderFriends(q);
}

// ===== OPEN FRIEND DETAIL =====
var currentFriend = -1;
function openDetail(i){
  currentFriend = i;
  var f = FRIENDS[i];
  var myF = getMyFriends();
  var reqs = getRequests();
  var isFriend = myF.indexOf(f.name) !== -1;
  var hasReq = reqs.some(function(r){return r.name === f.name;});
  
  var btnHtml = "";
  if(isFriend){
    btnHtml = '<button class="chatbtn" style="width:100%;padding:14px;font-size:16px;margin-top:10px;" onclick="openChat(\''+f.name+'\')">💬 Chat Karo</button>'
      + '<div style="color:#4caf50;font-weight:bold;margin-top:10px;">✅ Ye aapka dost hai</div>';
  } else if(hasReq){
    btnHtml = '<div style="color:#ff9800;font-weight:bold;margin-top:10px;">⏳ Request bhej di hai. Accept ka intezaar karo!</div>'
      + '<button class="sendbtn" style="background:#999" onclick="openMyRequests()">📩 Meri Requests Dekho</button>';
  } else {
    btnHtml = '<button class="sendbtn" onclick="sendRequest('+i+')">📩 Friend Request Bhejo</button>'
      + '<div style="font-size:12px;color:#999;margin-top:8px;">Example: "Hi '+f.name+'! Mujhe dost banao 🙏"</div>';
  }
  
  document.getElementById('detailCard').innerHTML =
    '<div class="bigphoto">'+f.photo+'</div>'
    + '<h2>'+f.name+'</h2>'
    + '<div class="role">'+f.role+'</div>'
    + '<div class="desc">'+f.detail+'</div>'
    + btnHtml;
  
  document.getElementById('listView').style.display = "none";
  document.getElementById('detailPage').style.display = "block";
  document.getElementById('chatPage').style.display = "none";
  window.scrollTo(0,0);
}

// ===== SEND FRIEND REQUEST =====
function sendRequest(i){
  var f = FRIENDS[i];
  var reqs = getRequests();
  if(reqs.some(function(r){return r.name === f.name;})){
    alert("Request pehle se bheji hui hai!");
    return;
  }
  var now = new Date();
  var time = now.getDate()+"/"+(now.getMonth()+1)+" "+now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
  reqs.push({name: f.name, time: time});
  saveRequests(reqs);
  alert("✅ "+f.name+" ko friend request bhej di!\n\nAb 'Meri Friend Requests' me jaakar Accept karo (demo).");
  renderRequests();
  openDetail(i); // refresh
}

// ===== ACCEPT / REJECT REQUEST =====
function acceptReq(i){
  var reqs = getRequests();
  var r = reqs[i];
  if(!r) return;
  
  var myF = getMyFriends();
  if(myF.indexOf(r.name) === -1){
    myF.push(r.name);
    saveMyFriends(myF);
  }
  reqs.splice(i, 1);
  saveRequests(reqs);
  
  alert("🎉 "+r.name+" ab aapka dost hai!\n\n'Mere Dost' list me dikhega. Chat karo!");
  renderRequests();
  renderMyFriends();
  renderFriends(document.getElementById('frSearch').value);
}

function rejectReq(i){
  var reqs = getRequests();
  var r = reqs[i];
  reqs.splice(i, 1);
  saveRequests(reqs);
  alert(r.name+" ki request hata di.");
  renderRequests();
  renderFriends(document.getElementById('frSearch').value);
}

function openMyRequests(){
  showList();
  document.getElementById('reqSec').scrollIntoView({behavior:'smooth'});
}

// ===== SHOW LIST VIEW =====
function showList(){
  document.getElementById('listView').style.display = "block";
  document.getElementById('detailPage').style.display = "none";
  document.getElementById('chatPage').style.display = "none";
  renderMyFriends();
  renderRequests();
  renderFriends(document.getElementById('frSearch').value);
  window.scrollTo(0,0);
}

// ===== CHAT =====
var chatWith = "";
function openChat(name){
  chatWith = name;
  var f = FRIENDS.find(function(x){return x.name === name;});
  var photo = f ? f.photo : "👤";
  
  document.getElementById('chatHead').innerHTML =
    '<div class="fp">'+photo+'</div><div class="nm">💬 '+name+'</div>';
  
  document.getElementById('listView').style.display = "none";
  document.getElementById('detailPage').style.display = "none";
  document.getElementById('chatPage').style.display = "block";
  
  loadMsgs();
  window.scrollTo(0,0);
}

function loadMsgs(){
  var chats = getChats();
  var msgs = chats[chatWith] || [];
  var box = document.getElementById('chatMsgs');
  var html = "";
  
  if(msgs.length === 0){
    html = '<div class="empty">👋 '+chatWith+' se chat shuru karo!<br>Neeche message likho ya 📎 se photo/video bhejo.</div>';
  } else {
    msgs.forEach(function(m){
      var cls = m.me ? "me" : "them";
      var content = "";
      if(m.type === "image"){
        content = '<img src="'+m.text+'">';
      } else if(m.type === "video"){
        content = '<video src="'+m.text+'" controls style="max-width:100%;border-radius:8px;"></video>';
      } else if(m.type === "file"){
        content = '📎 <a href="'+m.text+'" download="'+m.fname+'">'+m.fname+'</a>';
      } else {
        content = m.text.replace(/</g,"&lt;");
      }
      html += '<div class="msg '+cls+'">'+content+'<div class="tm">'+m.time+'</div></div>';
    });
  }
  
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function getTime(){
  var n = new Date();
  return n.getHours()+":"+String(n.getMinutes()).padStart(2,"0");
}

function sendMsg(){
  var inp = document.getElementById('chatText');
  var txt = inp.value.trim();
  if(!txt) return;
  
  var chats = getChats();
  if(!chats[chatWith]) chats[chatWith] = [];
  chats[chatWith].push({me:true, type:"text", text:txt, time:getTime()});
  saveChats(chats);
  
  inp.value = "";
  loadMsgs();
  
  // Demo auto-reply
  setTimeout(function(){
    var chats2 = getChats();
    var replies = ["Haan ji! 😊", "Achha!", "OK 👍", "Bahut badhiya!", "Samajh gaya!"];
    var r = replies[Math.floor(Math.random()*replies.length)];
    chats2[chatWith].push({me:false, type:"text", text:r, time:getTime()});
    saveChats(chats2);
    if(chatWith) loadMsgs();
  }, 1500);
}

function sendFile(input){
  var file = input.files[0];
  if(!file) return;
  
  if(file.size > 5*1024*1024){
    alert("File 5MB se chhoti honi chahiye!");
    input.value = "";
    return;
  }
  
  var reader = new FileReader();
  reader.onload = function(e){
    var chats = getChats();
    if(!chats[chatWith]) chats[chatWith] = [];
    var type = "file";
    if(file.type.indexOf("image") === 0) type = "image";
    else if(file.type.indexOf("video") === 0) type = "video";
    
    chats[chatWith].push({me:true, type:type, text:e.target.result, fname:file.name, time:getTime()});
    saveChats(chats);
    loadMsgs();
    input.value = "";
  };
  reader.readAsDataURL(file);
}

// ===== INIT =====
renderFriends("");
renderMyFriends();
renderRequests();
</script>
