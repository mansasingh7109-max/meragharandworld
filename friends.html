<script>
var DEMO=[
{photo:"👦",name:"Rahul",role:"Chef",detail:"Rahul hamara best chef hai."},
{photo:"👧",name:"Priya",role:"Manager",detail:"Priya sab manage karti hai."},
{photo:"👨",name:"Amit",role:"Delivery Boy",detail:"Amit tez delivery karta hai."},
{photo:"👩",name:"Sneha",role:"Waiter",detail:"Sneha customers ko achhe se handle karti hai."},
{photo:"🧑",name:"Vikash",role:"Cook",detail:"Vikash ke haath ka khana sabko pasand hai."},
{photo:"👴",name:"Ramesh",role:"Helper",detail:"Ramesh ji sabki madad karte hain."}
];
var FRIENDS=[];
var FRIEND_STATUS={};
var BLOCKED_UIDS={};
var MY_UID=getMyUid();
function getRequests(){try{return JSON.parse(localStorage.getItem("fr_requests")||"[]");}catch(e){return[];}}
function saveRequests(r){localStorage.setItem("fr_requests",JSON.stringify(r));}
function getMyFriends(){try{return JSON.parse(localStorage.getItem("fr_myfriends")||"[]");}catch(e){return[];}}
function saveMyFriends(f){localStorage.setItem("fr_myfriends",JSON.stringify(f));}
function getChats(){try{return JSON.parse(localStorage.getItem("fr_chats")||"{}");}catch(e){return{};}}
function saveChats(c){localStorage.setItem("fr_chats",JSON.stringify(c));}
function getDeleted(){try{return JSON.parse(localStorage.getItem("fr_deleted")||"[]");}catch(e){return[];}}
function saveDeleted(d){localStorage.setItem("fr_deleted",JSON.stringify(d));}
function getBlockedLocal(){try{return JSON.parse(localStorage.getItem("fr_blocked")||"[]");}catch(e){return[];}}
function photoHtml(photo){ if(!photo) return "👤"; if(String(photo).indexOf("<img")!==-1) return photo; if(String(photo).indexOf("http")===0||String(photo).indexOf("data:image")===0) return '<img src="'+photo+'">'; return photo; }
function loadStatus(cb){
  MY_UID=getMYUID();
  if(!_fbDb||!MY_UID){ if(cb)cb(); return; }
  var done=0; function one(){ done++; if(done>=4 && cb)cb(); }
  _fbDb.ref("friends/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){FRIEND_STATUS[k]="accepted";}); one(); }).catch(one);
  _fbDb.ref("friend_requests_sent/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(!FRIEND_STATUS[k]) FRIEND_STATUS[k]="sent"; }); one(); }).catch(one);
  _fbDb.ref("friend_requests/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(!FRIEND_STATUS[k]) FRIEND_STATUS[k]="incoming"; }); one(); }).catch(one);
  _fbDb.ref("blocked/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){FRIEND_STATUS[k]="blocked"; BLOCKED_UIDS[k]=true;}); one(); }).catch(one);
}
function loadRealFriends(){
  FRIENDS=DEMO.map(function(f,i){ return {photo:f.photo,name:f.name,role:f.role,detail:f.detail,_uid:"local_"+f.name.toLowerCase(),_phone:"",_isDemo:true}; });
  renderAll();
  if(!_fbDb){ document.getElementById('heroSub').textContent="Demo dost dikh rahe hain"; return; }
  _fbDb.ref("customer_profiles").once("value").then(function(snap){
    var val=snap.val()||{};
    var seen={};
    FRIENDS.forEach(function(f){ if(f._phone) seen[f._phone]=true; seen[f.name.toLowerCase()]=true; });
    Object.keys(val).forEach(function(uid){
      if(uid===MY_UID) return;
      var P=val[uid]||{};
      var name=(P.profileName||P.name||P.customer_name||"").toString().trim();
      var phone=(P.profilePhone||P.phone||P.mobile||"").toString().trim();
      if(!name){ if(phone) name="User "+phone.slice(-4); else if(P.email) name=P.email.split("@")[0]; else name="Friend "+uid.slice(0,4); }
      if(phone && seen[phone]) return;
      if(seen["n_"+name.toLowerCase()+"_"+phone]) return;
      seen[phone]=true; seen["n_"+name.toLowerCase()+"_"+phone]=true;
      var photo=P.profilePhoto||P.photo||P.profileImage||"👤";
      FRIENDS.push({photo:photo,name:name,role:P.role||P.profileDetail||"Friend",detail:P.profileDetail||P.status||P.detail||"Hi, main "+name+" hu!",_uid:uid,_phone:phone,_isDemo:false,_profile:P});
    });
    document.getElementById('heroSub').textContent="Total Friends: "+FRIENDS.length;
    renderAll();
  }).catch(function(){ renderAll(); });
}
function isBlocked(f){ if(BLOCKED_UIDS[f._uid]) return true; if(getBlockedLocal().indexOf(f.name)!==-1) return true; return FRIEND_STATUS[f._uid]==="blocked"; }
function isAccepted(f){ if(FRIEND_STATUS[f._uid]==="accepted") return true; if(getMyFriends().indexOf(f.name)!==-1) return true; return false; }
function isSent(f){ if(FRIEND_STATUS[f._uid]==="sent") return true; return false; }
function isIncoming(f){ if(FRIEND_STATUS[f._uid]==="incoming") return true; if(getRequests().some(function(r){return r.name===f.name;})) return true; return false; }
function renderAll(){
  var q=(document.getElementById('frSearch').value||"").toLowerCase();
  renderWorld(q); renderMyFriends(q); renderRequests(q); renderSent(q); renderBlocked(q);
}
function renderWorld(q){
  var grid=document.getElementById('friendsGrid'); var html=""; var count=0;
  FRIENDS.forEach(function(f,i){
    if(q && f.name.toLowerCase().indexOf(q)===-1) return;
    if(isBlocked(f)) return;
    if(isAccepted(f)) return;
    if(isSent(f)) return;
    if(isIncoming(f)) return;
    count++;
    html+='<div class="fcard" onclick="openDetailByUid(\''+f._uid+'\')"><div class="fp">'+photoHtml(f.photo)+'</div><div class="fn">'+f.name+'</div><div class="fr">'+(f.role||"")+'</div><div class="tap">Tap karo 👆</div></div>';
  });
  grid.innerHTML=html||'<div class="empty">World me koi naya dost nahi hai.<br>Sab dost neeche wale section me hain.</div>';
  document.getElementById('worldCount').textContent=count+" naye dost";
}
function renderMyFriends(q){
  var list=document.getElementById('myFriendsList'); var sec=document.getElementById('myFriendsSec');
  var arr=FRIENDS.filter(function(f){ if(q && f.name.toLowerCase().indexOf(q)===-1) return false; return isAccepted(f) && !isBlocked(f); });
  getMyFriends().forEach(function(nm){ if(!arr.some(function(x){return x.name===nm;})){ var d=DEMO.find(function(x){return x.name===nm;}); arr.push({photo:d?d.photo:"👤",name:nm,role:d?d.role:"Friend",detail:"",_uid:"local_"+nm.toLowerCase(),_phone:""}); } });
  if(arr.length===0){ sec.style.display="block"; document.getElementById('myFriendsList').innerHTML='<div class="empty">💚 Abhi koi Accepted dost nahi hai 👍</div>'; return; }sec.style.display="block";
  var html=""; arr.forEach(function(f){ html+='<div class="mycard"><div class="fp">'+photoHtml(f.photo)+'</div><div class="info"><div class="fn">'+f.name+'</div><div class="st">✅ Dost • '+(f.role||"")+'</div></div><button class="chatbtn" onclick="openChat(\''+f.name+'\',\''+f._uid+'\')">💬 Chat</button><button class="chatbtn" style="background:#e65100" onclick="openDetailByUid(\''+f._uid+'\')">👤 Profile</button></div>'; });
  list.innerHTML=html;
}
function renderRequests(q){
  var list=document.getElementById('reqList'); var sec=document.getElementById('reqSec');
  var arr=FRIENDS.filter(function(f){ return isIncoming(f) && !isBlocked(f) && (!q || f.name.toLowerCase().indexOf(q)!==-1); });
  getRequests().forEach(function(r){ if(!arr.some(function(x){return x.name===r.name;})){ arr.push({photo:"👤",name:r.name,role:"",detail:"",_uid:"local_"+r.name.toLowerCase(),_phone:""}); } });
  if(arr.length===0){ sec.style.display="block"; document.getElementById('reqList').innerHTML='<div class="empty">📩 Koi Request nahi aayi hai 👍</div>'; return; } sec.style.display="block";
  var html=""; arr.forEach(function(f){ html+='<div class="reqcard"><div class="fp">'+photoHtml(f.photo)+'</div><div class="info"><div class="fn">'+f.name+'</div><div class="tm">📩 Request aayi hai</div></div><div><button class="accbtn" onclick="acceptByUid(\''+f._uid+'\',\''+f.name+'\')">✅ Accept</button><button class="rejbtn" onclick="rejectByUid(\''+f._uid+'\',\''+f.name+'\')">❌</button></div></div>'; });
  list.innerHTML=html;
}
function renderSent(q){
  var list=document.getElementById('sentList'); var sec=document.getElementById('sentSec');
  var arr=FRIENDS.filter(function(f){ return isSent(f) && (!q || f.name.toLowerCase().indexOf(q)!==-1); });
   if(arr.length===0){ sec.style.display="block"; document.getElementById('sentList').innerHTML='<div class="empty">📤 Koi Sent Request nahi hai 👍</div>'; return; }sec.style.display="block";
  var html=""; arr.forEach(function(f){ html+='<div class="mycard" style="border-left:4px solid #2196F3"><div class="fp">'+photoHtml(f.photo)+'</div><div class="info"><div class="fn">'+f.name+'</div><div class="st" style="color:#2196F3">📤 Request bheji hai - Wait karo</div></div><button class="rejbtn" onclick="cancelSent(\''+f._uid+'\',\''+f.name+'\')">Cancel</button></div>'; });
  list.innerHTML=html;
}
function renderBlocked(q){
  var list=document.getElementById('blockList'); var sec=document.getElementById('blockSec');
  var arr=FRIENDS.filter(function(f){ return isBlocked(f) && (!q || f.name.toLowerCase().indexOf(q)!==-1); });
  if(arr.length===0){ sec.style.display="block"; document.getElementById('blockList').innerHTML='<div class="empty">🔴 Koi Block friend nahi hai 👍</div>'; return; } sec.style.display="block";
  var html=""; arr.forEach(function(f){ html+='<div class="mycard" style="border-left:4px solid #f44336"><div class="fp">'+photoHtml(f.photo)+'</div><div class="info"><div class="fn">'+f.name+'</div><div class="st" style="color:#f44336">🔴 Blocked</div></div><button class="accbtn" onclick="unblockByUid(\''+f._uid+'\',\''+f.name+'\')">✅ Unblock</button></div>'; });
  list.innerHTML=html;
}
function filterFriends(q){ renderAll(); }
function findByUid(uid){ return FRIENDS.find(function(f){return f._uid===uid;}) || FRIENDS.find(function(f){return "local_"+f.name.toLowerCase()===uid;}); }
var currentFriendUid="";
function openDetailByUid(uid){
  var f=findByUid(uid); if(!f) return; currentFriendUid=uid;
  var isF=isAccepted(f); var hasReq=isSent(f);
  var btnHtml="";
  if(isF){ btnHtml='<button class="chatbtn" style="width:100%;padding:14px;font-size:16px;margin-top:10px;" onclick="openChat(\''+f.name+'\',\''+f._uid+'\')">💬 Chat Karo - '+f.name+' se</button><div style="color:#4caf50;font-weight:bold;margin-top:10px;">✅ Already Friends - Mere Dost me hai</div>'; }
  else if(hasReq){ btnHtml='<div style="color:#ff9800;font-weight:bold;margin-top:10px;">📤 Request Bheji Hai - Wait Karo</div>'; }

  btnHtml+='<div style="margin-top:12px;display:grid;gap:8px;"><button class="sendbtn" style="background:#7b1fa2" onclick="location.href=\'profile.html?uid='+f._uid+'\'">👤 Friend Profile - '+f.name+' ka Profile Dekho</button><button class="sendbtn" style="background:#2196F3" onclick="location.href=\'album.html?uid='+f._uid+'\'">📸 Friend Album - '+f.name+' ka Album Dekho</button><button class="sendbtn" style="background:#ff7043" onclick="location.href=\'timedatalist.html?uid='+f._uid+'\'">📅 Friend Timeline - '+f.name+' ki Timeline Dekho</button><button class="sendbtn" style="background:#4caf50" onclick="location.href=\'index.html?uid='+f._uid+'\'">🏠 Friend Home - '+f.name+' ke Posts Dekho</button></div>';
  document.getElementById('detailCard').innerHTML='<div class="bigphoto">'+photoHtml(f.photo)+'</div><h2>'+f.name+'</h2><div class="role">'+(f.role||"")+'</div><div class="desc">'+(f.detail||"")+'</div>'+btnHtml;
  document.getElementById('listView').style.display="none"; document.getElementById('detailPage').style.display="block"; document.getElementById('chatPage').style.display="none"; window.scrollTo(0,0);
}
function sendRequestByUid(uid){ var f=findByUid(uid); if(!f) return; MY_UID=getMYUID(); if(!MY_UID){alert("Pehle login karo!"); location.href="customerlogin.html"; return;} if(_fbDb){ _fbDb.ref("friend_requests/"+uid).push({fromUid:MY_UID,fromName:getMyName(),time:Date.now(),status:"pending"}); _fbDb.ref("friend_requests_sent/"+MY_UID+"/"+uid).set({time:Date.now(),name:f.name}); } FRIEND_STATUS[uid]="sent"; alert("✅ "+f.name+" ko request bhej di!"); renderAll(); openDetailByUid(uid); }
function acceptByUid(uid,name){ MY_UID=getMYUID(); if(_fbDb && MY_UID){ _fbDb.ref("friends/"+MY_UID+"/"+uid).set({name:name,time:Date.now()}); _fbDb.ref("friends/"+uid+"/"+MY_UID).set({name:getMyName(),time:Date.now()}); _fbDb.ref("friend_requests/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(s.val()[k].fromUid===uid) _fbDb.ref("friend_requests/"+MY_UID+"/"+k).remove(); }); }); } var myF=getMyFriends(); if(myF.indexOf(name)===-1){myF.push(name); saveMyFriends(myF);} var reqs=getRequests().filter(function(r){return r.name!==name;}); saveRequests(reqs); FRIEND_STATUS[uid]="accepted"; alert("🎉 "+name+" ab dost hai!"); renderAll(); }
function rejectByUid(uid,name){ MY_UID=getMYUID(); if(_fbDb && MY_UID){ _fbDb.ref("friend_requests/"+MY_UID).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(s.val()[k].fromUid===uid) _fbDb.ref("friend_requests/"+MY_UID+"/"+k).remove(); }); }); } var reqs=getRequests().filter(function(r){return r.name!==name;}); saveRequests(reqs); FRIEND_STATUS[uid]="rejected"; alert(name+" ki request hata di."); renderAll(); }
function cancelSent(uid,name){ MY_UID=getMYUID(); if(_fbDb && MY_UID){ _fbDb.ref("friend_requests_sent/"+MY_UID+"/"+uid).remove(); } delete FRIEND_STATUS[uid]; alert("Cancel ho gaya"); renderAll(); }
function unblockByUid(uid,name){ MY_UID=getMYUID(); if(_fbDb && MY_UID){ _fbDb.ref("blocked/"+MY_UID+"/"+uid).remove(); } delete FRIEND_STATUS[uid]; delete BLOCKED_UIDS[uid]; var b=getBlockedLocal().filter(function(x){return x!==name;}); localStorage.setItem("fr_blocked",JSON.stringify(b)); alert("✅ Unblock ho gaya"); renderAll(); }

function goSec(id,btn){var e=document.getElementById(id);if(!e)return;if(e.style.display==='none'){var nm=id==='myFriendsSec'?'💚 Accepted me koi dost nahi hai':id==='reqSec'?'📩 Koi Request nahi aayi hai':id==='sentSec'?'📤 Koi Sent Request nahi hai':id==='blockSec'?'🔴 Koi Block friend nahi hai':'🌍 World me koi naya dost nahi hai';alert(nm);return;}e.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.topmenu button').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');}
function showList(){ document.getElementById('listView').style.display="block"; document.getElementById('detailPage').style.display="none"; document.getElementById('chatPage').style.display="none"; renderAll(); window.scrollTo(0,0); }
var chatWith=""; var chatMsgsCache=[]; var chatFriendUid="";
function chatPath(a,b){ return "chats/"+a+"/"+b; }
  function renderChatMenu(){
  var m=document.getElementById('chatMenu'); if(!m) return;
  var isBlocked=false;
  try{
    var bl=JSON.parse(localStorage.getItem("fr_blocked")||"[]");
    if(bl.indexOf(chatWith)!==-1) isBlocked=true;
    if(typeof FRIEND_STATUS!=="undefined" && FRIEND_STATUS[chatFriendUid]==="blocked") isBlocked=true;
  }catch(e){}
  var h='';
  if(isBlocked){
    h+='<button onclick="doUnblock()">✅ Unblock Karo</button>';

    h+='<button onclick="doBlock()">🚫 Block Karo</button>';
  }
  h+='<button onclick="deleteSelectedChat()">🗑️ Delete Selected</button>';

}
  
function openChat(name,uid){ chatWith=name; var f=findByUid(uid); if(f && f._uid && f._uid.indexOf("local_")!==0) chatFriendUid=f._uid; else if(uid && uid.indexOf("local_")!==0) chatFriendUid=uid; else if(f) chatFriendUid=f._uid; else chatFriendUid=uid||"local_"+name.toLowerCase(); var photo=f?f.photo:"👤"; document.getElementById('chatHead').innerHTML='<div class="fp">'+photoHtml(photo)+'</div><div class="nm">💬 '+name+'</div><button class="menubtn" onclick="renderChatMenu();var m=document.getElementById(\'chatMenu\');m.style.display=m.style.display===\'block\'?\'none\':\'block\'">⋮</button>'; document.getElementById('listView').style.display="none"; document.getElementById('detailPage').style.display="none"; document.getElementById('chatPage').style.display="block"; document.getElementById('chatMenu').style.display='none'; loadMsgs(); window.scrollTo(0,0); }
function loadMsgs(){
  MY_UID=getMYUID();
  var box=document.getElementById('chatMsgs');
  box.innerHTML='<div class="empty">⏳ Old chat load ho raha hai...</div>';
  var chats=getChats();
  var localMsgs=chats[chatWith]||[];
  var del=getDeleted(); var delIds={}; del.forEach(function(d){delIds[d.id]=true;});
  var merged=[]; localMsgs.forEach(function(m){ if(!delIds[m.id]) merged.push(m); });
  renderChatList(merged);
  if(!_fbDb||!MY_UID){ box.innerHTML='<div class="empty">🔐 Pehle login karo<br>UID khali hai isliye Firebase chat nahi dikh raha</div>'; return; }
  var p1=_fbDb.ref(chatPath(MY_UID,chatFriendUid)).once("value").then(function(s){return s.val()||{};}).catch(function(){return {};});
  var p2=_fbDb.ref(chatPath(chatFriendUid,MY_UID)).once("value").then(function(s){return s.val()||{};}).catch(function(){return {};});
  var p3=_fbDb.ref("chats/"+MY_UID).once("value").then(function(s){return s.val()||{};}).catch(function(){return {};});
  Promise.all([p1,p2,p3]).then(function(res){
    var map={}; merged.forEach(function(m){ if(m.id) map[m.id]=m; });
    [res[0],res[1]].forEach(function(obj){
      Object.keys(obj||{}).forEach(function(k){ var m=obj[k]; if(!m) return; var id=m.id||k; if(delIds[id]) return; var isMe=(m.fromUid===MY_UID)||(m.me===true && !m.fromUid); map[id]={id:id,me:isMe,type:m.type||"text",text:m.text||"",fname:m.fname||"",time:m.time||"",ts:m.ts||0,fromUid:m.fromUid||""}; });
    });
    Object.keys(res[2]||{}).forEach(function(fk){
      var msgs=res[2][fk]||{};
      Object.keys(msgs).forEach(function(k){
        var m=msgs[k]; if(!m) return;
        var id=m.id||(fk+"_"+k); if(delIds[id]) return;
        if(m.toName!==chatWith && m.fromName!==chatWith && m.toUid!==chatFriendUid && m.fromUid!==chatFriendUid && fk!==chatFriendUid) return;
        var isMe=(m.fromUid===MY_UID)||(m.me===true && !m.fromUid);
        map[id]={id:id,me:isMe,type:m.type||"text",text:m.text||"",fname:m.fname||"",time:m.time||"",ts:m.ts||0,fromUid:m.fromUid||""};
      });
    });
    var arr=Object.keys(map).map(function(k){return map[k];});
    arr.sort(function(a,b){return (a.ts||0)-(b.ts||0);});
    chatMsgsCache=arr; var c=getChats(); c[chatWith]=arr; saveChats(c);
    renderChatList(arr);
  });
}
function renderChatList(msgs){ var box=document.getElementById('chatMsgs'); if(!msgs||msgs.length===0){ box.innerHTML='<div class="empty">👋 '+chatWith+' se chat shuru karo!</div>'; return; } var html=""; msgs.forEach(function(m,i){ var cls=m.me?"me":"them"; var content=""; if(m.type==="image") content='<img src="'+m.text+'">'; else if(m.type==="video") content='<video src="'+m.text+'" controls style="max-width:100%;border-radius:8px;"></video>'; else if(m.type==="file") content='📎 <a href="'+m.text+'" download="'+(m.fname||"file")+'">'+(m.fname||"file")+'</a>'; else content=String(m.text||"").replace(/</g,"&lt;"); html+='<div class="msg '+cls+'"><label style="position:absolute;left:4px;top:4px"><input type="checkbox" class="msgSel" data-idx="'+i+'"></label><div style="padding-left:18px">'+content+'</div><div class="tm">'+(m.time||"")+'</div></div>'; }); box.innerHTML=html; box.scrollTop=box.scrollHeight; updateSelCount(); }
function updateSelCount(){ var n=document.querySelectorAll('.msgSel:checked').length; document.getElementById('selCount').textContent=n? n+" selected":""; }
document.addEventListener('change',function(e){ if(e.target.classList && e.target.classList.contains('msgSel')) updateSelCount(); });
function toggleSelAll(on){ document.querySelectorAll('.msgSel').forEach(function(c){c.checked=on;}); updateSelCount(); }
function getTime(){ var n=new Date(); return n.getHours()+":"+String(n.getMinutes()).padStart(2,"0"); }
function sendMsg(){ MY_UID=getMYUID(); var inp=document.getElementById('chatText'); var txt=inp.value.trim(); if(!txt) return; if(!MY_UID){ alert("Pehle login karo!"); location.href="customerlogin.html"; return; } var id="m_"+Date.now()+"_"+Math.floor(Math.random()*1000); var msg={id:id,me:true,type:"text",text:txt,time:getTime(),ts:Date.now(),fromUid:MY_UID,fromName:getMyName(),toUid:chatFriendUid,toName:chatWith}; var c=getChats(); if(!c[chatWith]) c[chatWith]=[]; c[chatWith].push(msg); saveChats(c); chatMsgsCache.push(msg); renderChatList(chatMsgsCache); inp.value=""; if(_fbDb){ _fbDb.ref(chatPath(MY_UID,chatFriendUid)+"/"+id).set(msg); _fbDb.ref(chatPath(chatFriendUid,MY_UID)+"/"+id).set(msg); } }
function sendFile(input){ MY_UID=getMYUID(); var file=input.files[0]; if(!file) return; if(file.size>5*1024*1024){ alert("File 5MB se chhoti honi chahiye!"); input.value=""; return; } var reader=new FileReader(); reader.onload=function(e){ var id="m_"+Date.now()+"_"+Math.floor(Math.random()*1000); var type="file"; if(file.type.indexOf("image")===0) type="image"; else if(file.type.indexOf("video")===0) type="video"; var msg={id:id,me:true,type:type,text:e.target.result,fname:file.name,time:getTime(),ts:Date.now(),fromUid:MY_UID,fromName:getMyName(),toUid:chatFriendUid,toName:chatWith}; var c=getChats(); if(!c[chatWith]) c[chatWith]=[]; c[chatWith].push(msg); saveChats(c); chatMsgsCache.push(msg); renderChatList(chatMsgsCache); if(_fbDb){ _fbDb.ref(chatPath(MY_UID,chatFriendUid)+"/"+id).set(msg); _fbDb.ref(chatPath(chatFriendUid,MY_UID)+"/"+id).set(msg); } input.value=""; }; reader.readAsDataURL(file); }
function getSelectedIdx(){ var arr=[]; document.querySelectorAll('.msgSel:checked').forEach(function(c){arr.push(parseInt(c.getAttribute('data-idx')));}); return arr; }


function deleteSelectedChat(){ MY_UID=getMYUID(); var idxs=getSelectedIdx(); if(idxs.length===0){ alert("Pehle koi message select karo"); return; } if(!confirm(idxs.length+" message delete karein? Sirf TUMHARE paas se delete hoga, dost ke paas rahega. Recycle me jayega.")) return; var del=getDeleted(); var toDel=idxs.map(function(i){return chatMsgsCache[i];}).filter(Boolean); toDel.forEach(function(m){ m.withName=chatWith; m.withUid=chatFriendUid; m.deletedTime=Date.now(); del.push(m); if(_fbDb && m.id){ _fbDb.ref("recycle_bin/"+MY_UID+"/"+m.id).set(m); } }); saveDeleted(del); var delSet={}; toDel.forEach(function(m){delSet[m.id]=true;}); chatMsgsCache=chatMsgsCache.filter(function(m){return !delSet[m.id];}); var c=getChats(); c[chatWith]=chatMsgsCache; saveChats(c); renderChatList(chatMsgsCache); alert("✅ Delete ho gaya - Recycle me hai, dost ke paas abhi bhi hai"); }
function deleteAllChat(){ MY_UID=getMYUID(); if(!confirm("Saara chat delete karein? Sirf TUMHARE paas se delete hoga.")) return; var del=getDeleted(); chatMsgsCache.forEach(function(m){ m.withName=chatWith; m.withUid=chatFriendUid; m.deletedTime=Date.now(); del.push(m); if(_fbDb && m.id){ _fbDb.ref("recycle_bin/"+MY_UID+"/"+m.id).set(m); } }); saveDeleted(del); chatMsgsCache=[]; var c=getChats(); c[chatWith]=[]; saveChats(c); renderChatList([]); alert("✅ Saara chat delete ho gaya - Recycle me hai"); }




function showRecycle(){ MY_UID=getMYUID(); var del=getDeleted(); if(del.length===0){ alert("Recycle khali hai"); return; } if(confirm("♻️ Recycle me "+del.length+" messages hain. Wapas laayein?")){ var c=getChats(); if(!c[chatWith]) c[chatWith]=[]; del.forEach(function(m){ c[chatWith].push(m); if(_fbDb && m.id){ _fbDb.ref(chatPath(MY_UID,chatFriendUid)+"/"+m.id).set(m); } }); saveChats(c); saveDeleted([]); chatMsgsCache=c[chatWith]; renderChatList(chatMsgsCache); alert("✅ Wapas aa gaya!"); } }
function doBlock(){ MY_UID=getMYUID(); if(!confirm(chatWith+" ko Block karein?")) return; var bl=getBlockedLocal(); if(bl.indexOf(chatWith)===-1){bl.push(chatWith); localStorage.setItem("fr_blocked",JSON.stringify(bl));} if(_fbDb){ _fbDb.ref("blocked/"+MY_UID+"/"+chatFriendUid).set({name:chatWith,time:Date.now()}); } FRIEND_STATUS[chatFriendUid]="blocked"; BLOCKED_UIDS[chatFriendUid]=true; alert("🚫 Block ho gaya"); renderAll(); }
  function doUnblock(){ MY_UID=getMYUID(); var bl2=getBlockedLocal().filter(function(x){return x!==chatWith;}); localStorage.setItem("fr_blocked",JSON.stringify(bl2)); if(_fbDb){ _fbDb.ref("blocked/"+MY_UID+"/"+chatFriendUid).remove(); } delete FRIEND_STATUS[chatFriendUid]; delete BLOCKED_UIDS[chatFriendUid]; alert("✅ Unblock ho gaya"); renderAll(); }
function sendToGmail(){ var txt=chatMsgsCache.map(function(m){return (m.me?"Me":chatWith)+": "+m.text;}).join("\n"); window.open("mailto:?subject="+encodeURIComponent("Chat with "+chatWith)+"&body="+encodeURIComponent(txt||"Chat khali hai")); if(_fbDb){ _fbDb.ref("chat_exports/"+MY_UID).push({with:chatWith,text:txt,time:Date.now()}); } alert("📧 Gmail khul gaya"); }
