<style>

<header id="hdr"><a class="backbtn" href="friends.html">← Wapas</a><div style="flex:1;text-align:center;font-weight:bold">👤 Friend Profile</div><div style="width:70px"></div></header>
<div class="wrap"><div class="card" id="card"><div class="bigphoto" id="photo">👤</div><h2 id="name">Loading...</h2><div class="role" id="role"></div><div class="desc" id="detail"></div><div class="badge" id="statusBox"></div><div id="btns"></div><div class="lock" id="lockNote"></div></div></div>
<script>

function toArrFP(v){ if(Array.isArray(v)) return v; if(v&&typeof v==="object") return Object.keys(v).map(function(k){return v[k];}); return []; }
function dedupeFP(arr){ var seen={},out=[]; arr.forEach(function(e){ if(!e||typeof e!=="object") return; var k=(e.date||"")+"|"+(e.text||"")+"|"+(e.photo||"")+"|"+(e.url||""); if(seen[k]) return; seen[k]=1; out.push(e); }); return out; }
function privOfFP(P, key){ var priv=P.privacy; if(typeof priv==="string"&&priv==="private") return true; if(priv&&typeof priv==="object"){ if(priv[key]==="private"||priv[key+"Public"]==="off"||priv[key+"Public"]===false) return true; } if(P[key+"Public"]==="off"||P[key+"Public"]===false) return true; return false; }
function loadAlbumTimeline(P){
  if(!_fbDb||!friendUid) return;
  var isFriend=(friendStatus==="accepted");
  // Album privacy: friend ho to khul jayega
  var albPriv = isFriend ? false : privOfFP(P,"album");
  var tlPriv = isFriend ? false : privOfFP(P,"detail");
  document.getElementById('albumStatus').textContent = albPriv ? "🔒 Private" : "🌍 Public";
  document.getElementById('timelineStatus').textContent = tlPriv ? "🔒 Private" : "🌍 Public";
  // --- ALBUM: customer_albums/<uid> + profile.extraPhotos + main photo ---
  _fbDb.ref("customer_albums/"+friendUid).once("value").then(function(s){
    if(albPriv){ document.getElementById('albumGrid').innerHTML='<div class="lock">🔒 Album Private hai - sirf dost dekh sakte hain</div>'; return; }
    var node=[]; var v=s.val()||{};
    Object.keys(v).forEach(function(k){ var x=v[k]; if(typeof x==="string") node.push(x); else if(x&&(x.url||x.photo)) node.push(x.url||x.photo); });
    var seen={}; var photos=[];
    function addPh(ph){ if(ph&&typeof ph==="string"&&(ph.indexOf("http")===0||ph.indexOf("data:")===0)&&!seen[ph]){ seen[ph]=1; photos.push(ph); } }
    addPh(P.profilePhoto||P.photo); (P.extraPhotos||[]).forEach(addPh); node.forEach(addPh);
    // detail/thinking wali photos bhi album me
    toArrFP(P.details).concat(toArrFP(P.thinkings)).forEach(function(e){ if(e&&e.photo) addPh(e.photo); });
    document.getElementById('albumGrid').innerHTML = photos.length ? photos.map(function(ph){ return '<img src="'+ph+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px" onclick="openPhotoPreview(this.src)">'; }).join("") : '<div class="lock">📸 Koi photo nahi hai</div>';
    document.getElementById('albumNote').textContent = photos.length ? photos.length+" photos" : "";
  }).catch(function(e){ document.getElementById('albumNote').textContent='❌ Album load nahi hua: '+(e&&e.message||e); });
  // --- TIMELINE: customer_details + customer_thinkings + profile ke andar wale + timeline node, date-wise ---
  Promise.all([
    _fbDb.ref("customer_details/"+friendUid).once("value").catch(function(){return {val:function(){return null;}};}),
    _fbDb.ref("customer_thinkings/"+friendUid).once("value").catch(function(){return {val:function(){return null;}};}),
    _fbDb.ref("timeline/"+friendUid).once("value").catch(function(){return {val:function(){return null;}};})
  ]).then(function(res){
    if(tlPriv){ document.getElementById('timelineList').innerHTML='<div class="lock">🔒 Timeline Private hai - sirf dost dekh sakte hain</div>'; return; }
    var details=dedupeFP(toArrFP(P.details).concat(toArrFP(res[0].val())));
    var thinks=dedupeFP(toArrFP(P.thinkings).concat(toArrFP(res[1].val())));
    var tlNode=toArrFP(res[2].val());
    var all=[];
    details.filter(function(x){return x&&(x.vis!=="private"&&x.private!==true)&&(String(x.text||"").trim()!=="Customer ka lamba detail yahan likho.");}).forEach(function(e){ all.push({kind:"📝 Detail",date:e.date||"",text:e.text||"",photo:e.photo||"",ts:e.ts||e.timestamp||Date.parse(e.date||"")||0}); });
    thinks.filter(function(x){return x&&(x.vis!=="private"&&x.private!==true)&&(String(x.text||"").trim()!=="Customer ka lamba detail yahan likho.");}).forEach(function(e){ all.push({kind:"💭 Thinking",date:e.date||"",text:e.text||"",photo:e.photo||"",ts:e.ts||e.timestamp||Date.parse(e.date||"")||0}); });
    tlNode.forEach(function(e){ if(e&&typeof e==="object") all.push({kind:"📅",date:e.date||"",text:e.text||e.detail||"",photo:e.photo||e.url||"",ts:e.ts||e.timestamp||Date.parse(e.date||"")||0}); });
    all.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    document.getElementById('timelineList').innerHTML = all.length ? all.map(function(e){ return '<div style="border-bottom:1px solid #eee;padding:10px 0"><b>'+esc(e.kind)+'</b> <span style="color:#999;font-size:12px">'+esc(e.date||"")+'</span><div style="margin-top:4px">'+esc(e.text||"")+'</div>'+(e.photo?'<img src="'+e.photo+'" onclick="openPhotoPreview(\''+e.photo+'\')" style="width:90px;height:90px;object-fit:cover;border-radius:8px;margin-top:6px;cursor:pointer">':"")+'</div>'; }).join("") : '<div class="lock">📅 Koi Timeline entry nahi hai</div>';
  });
}

function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getMyUid(){try{return localStorage.getItem("auth_uid")||"";}catch(e){return "";}}
function getMyName(){try{return localStorage.getItem("customer_name")||localStorage.getItem("customer_username")||"Me";}catch(e){return "Me";}}
// Sirf isi friend ka UID - URL se: friend-profile.html?uid=FRIEND_UID
var friendUid=""; try{var m=location.search.match(/[?&]uid=([^&]+)/); if(m) friendUid=decodeURIComponent(m[1]);}catch(e){}
var myUid=getMyUid(); var friendName="Friend"; var friendStatus="none";
// STATUS - sirf isi uid ka: friends / friend_requests_sent / friend_requests / blocked
function loadStatus(cb){
  if(!_fbDb||!myUid||!friendUid){ if(cb)cb(); return; }
  var done=0; function one(){done++; if(done>=4&&cb)cb();}
  _fbDb.ref("friends/"+myUid+"/"+friendUid).once("value").then(function(s){ if(s.val()) friendStatus="accepted"; one(); }).catch(one);
  _fbDb.ref("friend_requests_sent/"+myUid+"/"+friendUid).once("value").then(function(s){ if(s.val()&&friendStatus==="none") friendStatus="sent"; one(); }).catch(one);
  _fbDb.ref("friend_requests/"+myUid).once("value").then(function(s){ var v=s.val()||{}; Object.keys(v).forEach(function(k){ if(v[k]&&v[k].fromUid===friendUid&&friendStatus==="none") friendStatus="incoming"; }); one(); }).catch(one);
  _fbDb.ref("blocked/"+myUid+"/"+friendUid).once("value").then(function(s){ if(s.val()) friendStatus="blocked"; one(); }).catch(one);
}
function render(P){
  friendName=P.profileName||P.name||P.customer_name||"Friend";
  var photo=P.profilePhoto||P.photo||P.profileImage||"👤";
  document.getElementById('name').textContent=friendName;
  document.getElementById('role').textContent=P.role||P.profileDetail||"Friend";
  // Public detail hi dikhega - private detail friend ko lock dikhega
  var isFriend=(friendStatus==="accepted");
  var detail=P.profileDetail||P.status||P.detail||""; if(detail.trim()==="Customer ka lamba detail yahan likho.") detail="";
  if(detail && !isFriend && P.detailPrivacy==="private"){ document.getElementById('detail').textContent="🔒 Private - sirf dost dekh sakte hain"; }
  else document.getElementById('detail').textContent=detail||"Hi, main "+friendName+" hu!";
  var ph=document.getElementById('photo');
  if(String(photo).indexOf("http")===0||String(photo).indexOf("data:")===0) ph.innerHTML='<img src="'+photo+'" onclick="openPhotoPreview(\''+photo+'\')" style="cursor:pointer">'; else ph.textContent=photo;
  var box=document.getElementById('statusBox'); var btns=document.getElementById('btns');
  if(friendStatus==="accepted"){ box.style.background="#e8f5e9"; box.style.color="#2e7d32"; box.textContent="✅ Already Friends - Mere Dost me hai";
    btns.innerHTML='<button class="btn" style="background:#25D366" onclick="location.href=\'chat-box.html?uid='+friendUid+'\'">💬 Chat Karo - '+esc(friendName)+' se</button>';
  } else if(friendStatus==="sent"){ box.style.background="#fff3e0"; box.style.color="#e65100"; box.textContent="📤 Request Bheji Hai - Wait Karo";
    btns.innerHTML='<button class="btn" style="background:#f44336" onclick="cancelSent()">Cancel Request</button>';
  } else if(friendStatus==="incoming"){ box.style.background="#fff3e0"; box.style.color="#e65100"; box.textContent="📩 Request Aayi Hai";
    btns.innerHTML='<button class="btn" style="background:#4caf50" onclick="acceptReq()">✅ Accept Karo</button><button class="btn" style="background:#f44336" onclick="rejectReq()">❌ Reject Karo</button>';
  } else if(friendStatus==="blocked"){ box.style.background="#ffebee"; box.style.color="#f44336"; box.textContent="🔴 Blocked hai";
    btns.innerHTML='<button class="btn" style="background:#4caf50" onclick="unblock()">✅ Unblock Karo</button>';
  } else { box.style.background="#fff3e0"; box.style.color="#e65100"; box.textContent="👋 Naya Dost";
    btns.innerHTML='<button class="btn" style="background:#e65100" onclick="sendReq()">📩 Friend Request Bhejo - '+esc(friendName)+' ko</button>';
  }
  // BLOCK BUTTON - profile par hi (naam click karke yahan aane par dikhega)
  var bb=document.getElementById('btns');
  if(friendStatus==="blocked"){
    // Unblock button pehle se hai (blocked wale branch me), dobara mat jodo
  } else {
    bb.innerHTML += '<button class="btn" style="background:#d32f2f" onclick="doProfileBlock()">🚫 Block Karo - '+esc(friendName)+' ko</button>';
  }
  document.getElementById('lockNote').textContent = isFriend ? "" : "🔒 Private sections sirf dost ko dikhenge";
}

// PHOTO PREVIEW CODE - album/profile ki photo pe click karo to full preview
function openPhotoPreview(src){ var m=document.getElementById('photoPreview'); var im=document.getElementById('photoPreviewImg'); if(!m||!im) return; im.src=src; m.style.display="flex"; }
function closePhotoPreview(){ var m=document.getElementById('photoPreview'); if(m) m.style.display="none"; }

function load(){
  if(!friendUid){ document.getElementById('name').textContent="Friend nahi mila - friends.html se kholo"; return; }
  if(!_fbDb){ document.getElementById('name').textContent="Data load nahi hua - dobara kholo"; return; }
  // Sirf isi UID ka data - customer_profiles / FRIEND_UID
  _fbDb.ref("customer_profiles/"+friendUid).once("value").then(function(s){
    var P=s.val()||{};
    if(!P||!Object.keys(P).length){ document.getElementById('name').textContent='Is friend ka profile nahi mila'; return; }
    loadStatus(function(){ render(P); loadAlbumTimeline(P); });
  }).catch(function(e){
    console.log('firebase load fail', e);
    document.getElementById('name').textContent="Data load nahi hua - dobara kholo";
  });
}
function sendReq(){ if(!myUid){alert("Pehle login karo!");location.href="customerlogin.html";return;} if(_fbDb){ _fbDb.ref("friend_requests/"+friendUid).push({fromUid:myUid,fromName:getMyName(),time:Date.now(),status:"pending"}); _fbDb.ref("friend_requests_sent/"+myUid+"/"+friendUid).set({time:Date.now(),name:friendName}); } friendStatus="sent"; load(); alert("✅ "+friendName+" ko request bhej di!"); }
function acceptReq(){ if(_fbDb&&myUid){ _fbDb.ref("friends/"+myUid+"/"+friendUid).set({name:friendName,time:Date.now()}); _fbDb.ref("friends/"+friendUid+"/"+myUid).set({name:getMyName(),time:Date.now()}); _fbDb.ref("friend_requests/"+myUid).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(s.val()[k].fromUid===friendUid) _fbDb.ref("friend_requests/"+myUid+"/"+k).remove(); }); }); } friendStatus="accepted"; load(); alert("🎉 "+friendName+" ab dost hai!"); }
function rejectReq(){ if(_fbDb&&myUid){ _fbDb.ref("friend_requests/"+myUid).once("value").then(function(s){ Object.keys(s.val()||{}).forEach(function(k){ if(s.val()[k].fromUid===friendUid) _fbDb.ref("friend_requests/"+myUid+"/"+k).remove(); }); }); } friendStatus="none"; load(); alert(friendName+" ki request hata di."); }
function cancelSent(){ if(_fbDb&&myUid){ _fbDb.ref("friend_requests_sent/"+myUid+"/"+friendUid).remove(); } friendStatus="none"; load(); alert("Cancel ho gaya"); }
function doProfileBlock(){ if(!confirm(friendName+" ko Block karein?")) return; if(_fbDb&&myUid){ _fbDb.ref("blocked/"+myUid+"/"+friendUid).set({name:friendName,time:Date.now()}); } friendStatus="blocked"; load(); alert("🚫 Block ho gaya"); }
function unblock(){ if(_fbDb&&myUid){ _fbDb.ref("blocked/"+myUid+"/"+friendUid).remove(); } friendStatus="none"; load(); alert("✅ Unblock ho gaya"); }
load();
</script>

<div id="photoPreview" onclick="closePhotoPreview()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;cursor:pointer">
  <img id="photoPreviewImg" src="" style="max-width:95%;max-height:85vh;border-radius:12px;object-fit:contain">
  <div style="color:#fff;margin-top:12px;font-weight:bold">✕ Band karne ke liye photo pe tap karo</div>
</div>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();



// Login Firebase se - sab files me ek hi login
function syncLoginToFirebase(){
  if(!_fbDb || !myUid) return;
  _fbDb.ref("login_sessions/"+myUid).set({uid:myUid, active:true, loginAt:Date.now()});
  _fbDb.ref("login_sessions/"+myUid+"/active").on("value", function(s){
    if(s.val()===false){ localStorage.removeItem("auth_uid"); location.href='customerlogin.html'; }
  });
}
// Login ke baad isko bulao: syncLoginToFirebase();

// Logout pe ye daalo:
_fbDb.ref("login_sessions/"+myUid).update({active:false, logoutAt:Date.now()});
