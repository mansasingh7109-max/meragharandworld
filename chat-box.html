<style>

<script>
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function getMyUid(){try{return localStorage.getItem("auth_uid")||"";}catch(e){return "";}}
function getMyName(){try{return localStorage.getItem("customer_name")||localStorage.getItem("customer_username")||"Me";}catch(e){return "Me";}}
var friendUid=""; try{var m=location.search.match(/[?&]uid=([^&]+)/); if(m) friendUid=decodeURIComponent(m[1]);}catch(e){}
var myUid=getMyUid(); var friendName="Friend", friendPhoto="👤";
var msgsCache=[], recycleCache=[], viewMode="chat", selectedIdx=[];
var blockedNow=false;
// DATE-TIME - hamesha poori date + time: 9 Nov 2026, 11:47 PM
function fmtDT(ts){try{var d=new Date(ts||Date.now());var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];var h=d.getHours();var ap=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;return d.getDate()+" "+mo[d.getMonth()]+" "+d.getFullYear()+", "+h+":"+String(d.getMinutes()).padStart(2,"0")+" "+ap;}catch(e){return "";}}
function chatTime(m){ if(m&&(m.ts||m.timestamp)) return fmtDT(m.ts||m.timestamp); return (m&&m.time)||""; }
// LOCAL BACKUP KEY - hamesha save rahega, net na bhi ho to
function backupKey(){ return "chat_backup_"+myUid+"_"+friendUid; }
function loadBackup(){ try{return JSON.parse(localStorage.getItem(backupKey())||"[]");}catch(e){return [];} }
function saveBackup(arr){ try{localStorage.setItem(backupKey(), JSON.stringify(arr));}catch(e){} }
function recycleKey(){ return "chat_recycle_"+myUid+"_"+friendUid; }
function loadRecycleLocal(){ try{return JSON.parse(localStorage.getItem(recycleKey())||"[]");}catch(e){return [];} }
function saveRecycleLocal(arr){ try{localStorage.setItem(recycleKey(), JSON.stringify(arr));}catch(e){} }
function chatPath(){ return "chats/"+myUid+"/"+friendUid; }
function chatPathRev(){ return "chats/"+friendUid+"/"+myUid; }
function recyclePath(){ return "recycle_bin/"+myUid+"/"+friendUid; }
function loadFriend(){
  if(!friendUid){document.getElementById('headName').textContent="Friend nahi mila - friends.html se kholo";return;}
  if(!_fbDb) return;
  _fbDb.ref("customer_profiles/"+friendUid).once("value").then(function(s){
    var P=s.val()||{}; friendName=P.profileName||P.name||P.customer_name||"Friend";
    friendPhoto=P.profilePhoto||P.photo||P.profileImage||"👤";
    document.getElementById('headName').textContent=friendName;
    document.getElementById('headStatus').textContent=(P.role||P.profileDetail||"");
    var hp=document.getElementById('headPhoto');
    if(String(friendPhoto).indexOf("http")===0||String(friendPhoto).indexOf("data:")===0) hp.innerHTML='<img src="'+friendPhoto+'">'; else hp.textContent=friendPhoto;
  });
  if(myUid){ _fbDb.ref("blocked/"+myUid+"/"+friendUid).once("value").then(function(s){ blockedNow=!!s.val(); updateHeadStatus(); }); }
}
function updateHeadStatus(){ document.getElementById('headStatus').textContent = blockedNow ? "🔴 Blocked" : ""; var bb=document.getElementById('headBlockBtn'); if(bb) bb.textContent = blockedNow ? "✅ Unblock" : "🚫 Block"; }
// MENU - ⋮ dabane par popup: Block / Delete / Recycle / Gmail
function toggleMenu(e){ if(e) e.stopPropagation(); var m=document.getElementById('chatMenu'); if(m.style.display==="block"){m.style.display="none";return;} renderMenu(); m.style.display="block"; }
function renderMenu(){
  var m=document.getElementById('chatMenu'); var h="";
  h+='<button onclick="closeMenu();doBlockToggle()">'+(blockedNow?"✅ Unblock Karo":"🚫 Block Karo")+'</button>';
  h+='<button onclick="closeMenu();deleteSelected()">🗑️ Delete Selected</button>';
  h+='<button onclick="closeMenu();deleteAll()">🗑️ All Delete</button>';
  h+='<button onclick="closeMenu();showRecycle()">♻️ Recycle Bin Dekho</button>';
  h+='<button onclick="closeMenu();showChat()">💬 Chat Wapas Dekho</button>';
  h+='<button onclick="closeMenu();sendToGmail()">📧 Send to Gmail</button>';
  h+='<button onclick="closeMenu()">✕ Band Karo</button>';
  m.innerHTML=h;
}
function closeMenu(){ document.getElementById('chatMenu').style.display="none"; }
document.addEventListener('click',function(e){ var m=document.getElementById('chatMenu'); if(m&&m.style.display==="block"&&!m.contains(e.target)&&!e.target.classList.contains('menubtn')) m.style.display="none"; });
// CHAT LOAD - Firebase se + local backup se, hamesha save rahega
function loadMsgs(){
  var box=document.getElementById('chatMsgs');
  if(!myUid){box.innerHTML='<div class="empty">🔐 Pehle login karo</div>';return;}
  var bk=loadBackup(); if(bk.length){ msgsCache=bk; renderList(bk); }
  if(!_fbDb) return;
  _fbDb.ref(chatPath()).on("value",function(snap){
    var val=snap.val()||{}; var arr=Object.keys(val).map(function(k){var m=val[k];m.id=m.id||k;return m;});
    arr.sort(function(a,b){return (a.ts||a.timestamp||0)-(b.ts||b.timestamp||0);});
    msgsCache=arr; saveBackup(arr); if(viewMode==="chat") renderList(arr);
  });
  _fbDb.ref(recyclePath()).on("value",function(snap){
    var val=snap.val()||{}; var arr=Object.keys(val).map(function(k){var m=val[k];m.id=m.id||k;return m;});
    arr.sort(function(a,b){return (b.deletedTime||0)-(a.deletedTime||0);});
    recycleCache=arr; saveRecycleLocal(arr); if(viewMode==="recycle") renderRecycle();
  });
}
function renderList(arr){
  viewMode="chat"; selectedIdx=[]; updateSelCount();
  document.getElementById('viewBar').style.display="none";
  var box=document.getElementById('chatMsgs');
  if(!arr.length){box.innerHTML='<div class="empty">👋 '+esc(friendName)+' se chat shuru karo!</div>';return;}
  var html=""; arr.forEach(function(m,i){
    var cls=(m.fromUid===myUid||m.me===true)?"me":"them"; var content="";
    if(m.type==="image") content='<img src="'+m.text+'">';
    else if(m.type==="video") content='<video src="'+m.text+'" controls style="max-width:100%;border-radius:8px;"></video>';
    else if(m.type==="file") content='📎 <a href="'+m.text+'" download="'+esc(m.fname||"file")+'">'+esc(m.fname||"file")+'</a>';
    else content=esc(m.text||"");
    var chk='<input type="checkbox" class="msgSel" data-idx="'+i+'" onchange="onSelChange()" style="width:18px;height:18px">';
    html+='<div class="msg '+cls+'"><label class="sel">'+chk+'</label><div style="padding-left:22px">'+content+'</div><div class="tm">'+esc(chatTime(m))+'</div></div>';
  });
  box.innerHTML=html; box.scrollTop=box.scrollHeight;
}
function onSelChange(){ selectedIdx=[]; document.querySelectorAll('.msgSel:checked').forEach(function(c){selectedIdx.push(parseInt(c.getAttribute('data-idx')));}); updateSelCount(); }
function toggleSelAll(on){ document.querySelectorAll('.msgSel').forEach(function(c){c.checked=on;}); onSelChange(); }
function updateSelCount(){ var sc=document.getElementById('selCount'); if(sc) sc.textContent = selectedIdx.length ? selectedIdx.length+" selected" : ""; }
function showChat(){ viewMode="chat"; renderList(msgsCache); }
// SEND - Firebase (dono taraf) + local backup, hamesha save
function sendMsg(){
  var inp=document.getElementById('chatText'); var txt=inp.value.trim(); if(!txt) return;
  if(!myUid){alert("Pehle login karo!");location.href="customerlogin.html";return;}
  var ts=Date.now(); var id="m_"+ts+"_"+Math.floor(Math.random()*1000);
  var msg={id:id,me:true,type:"text",text:txt,time:fmtDT(ts),ts:ts,fromUid:myUid,fromName:getMyName(),toUid:friendUid,toName:friendName};
  msgsCache.push(msg); saveBackup(msgsCache); renderList(msgsCache); inp.value="";
  if(_fbDb){ _fbDb.ref(chatPath()+"/"+id).set(msg); _fbDb.ref(chatPathRev()+"/"+id).set(msg); }
}
function sendFile(input){
  var file=input.files[0]; if(!file) return;
  if(file.size>5*1024*1024){alert("File 5MB se chhoti honi chahiye!");input.value="";return;}
  var reader=new FileReader(); reader.onload=function(e){
    var ts=Date.now(); var id="m_"+ts+"_"+Math.floor(Math.random()*1000);
    var type="file"; if(file.type.indexOf("image")===0) type="image"; else if(file.type.indexOf("video")===0) type="video";
    var msg={id:id,me:true,type:type,text:e.target.result,fname:file.name,time:fmtDT(ts),ts:ts,fromUid:myUid,fromName:getMyName(),toUid:friendUid,toName:friendName};
    msgsCache.push(msg); saveBackup(msgsCache); renderList(msgsCache);
    if(_fbDb){ _fbDb.ref(chatPath()+"/"+id).set(msg); _fbDb.ref(chatPathRev()+"/"+id).set(msg); }
    input.value="";
  }; reader.readAsDataURL(file);
}
// DELETE -> RECYCLE BIN (dost ke paas rahega, mere paas Recycle me jayega)
function moveToRecycle(list){
  if(!list.length) return;
  list.forEach(function(m){
    m.withName=friendName; m.withUid=friendUid; m.deletedTime=Date.now();
    if(_fbDb) _fbDb.ref(recyclePath()+"/"+m.id).set(m);
  });
  var rl=loadRecycleLocal(); list.forEach(function(m){ if(!rl.some(function(x){return x.id===m.id;})) rl.push(m); });
  saveRecycleLocal(rl); recycleCache=rl;
  var delSet={}; list.forEach(function(m){delSet[m.id]=true;});
  msgsCache=msgsCache.filter(function(m){return !delSet[m.id];});
  saveBackup(msgsCache);
  list.forEach(function(m){ if(_fbDb){ _fbDb.ref(chatPath()+"/"+m.id).remove(); _fbDb.ref(chatPathRev()+"/"+m.id).remove(); } });
  renderList(msgsCache);
}
function deleteSelected(){
  var list=selectedIdx.map(function(i){return msgsCache[i];}).filter(Boolean);
  if(viewMode==="recycle"){ restoreSelected(); return; }
  if(!list.length){alert("Pehle koi message select karo (checkbox tick karo)");return;}
  if(!confirm(list.length+" message delete karein? Sirf TUMHARE paas se delete hoga, Recycle me jayega.")) return;
  moveToRecycle(list); alert("✅ Delete ho gaya - Recycle Bin me hai");
}
function deleteAll(){
  if(viewMode==="recycle"){ alert("Recycle me ho - wahan se Restore karo ya Recycle khaali karo"); return; }
  if(!msgsCache.length){alert("Chat khaali hai");return;}
  if(!confirm("Saara chat delete karein? Sirf TUMHARE paas se delete hoga, Recycle me jayega.")) return;
  moveToRecycle(msgsCache.slice()); alert("✅ Saara chat Recycle Bin me hai");
}
// RECYCLE BIN - dekho + wapas lao
function showRecycle(){
  viewMode="recycle"; selectedIdx=[]; updateSelCount();
  var bar=document.getElementById('viewBar'); bar.style.display="block";
  bar.innerHTML='♻️ Recycle Bin - '+recycleCache.length+' deleted messages &nbsp; <button onclick="restoreAll()" style="background:#4caf50;color:#fff;border:none;padding:6px 12px;border-radius:14px;font-weight:bold;cursor:pointer">↩️ Sab Wapas Lao</button> <button onclick="emptyRecycle()" style="background:#f44336;color:#fff;border:none;padding:6px 12px;border-radius:14px;font-weight:bold;cursor:pointer">🗑️ Recycle Khaali Karo</button>';
  renderRecycle();
}
function renderRecycle(){
  var box=document.getElementById('chatMsgs');
  if(!recycleCache.length){box.innerHTML='<div class="empty">♻️ Recycle khaali hai</div>';return;}
  var html=""; recycleCache.forEach(function(m,i){
    var content=""; if(m.type==="image") content='<img src="'+m.text+'">'; else if(m.type==="video") content='<video src="'+m.text+'" controls style="max-width:100%;border-radius:8px;"></video>'; else content=esc(m.text||"");
    html+='<div class="msg them"><label class="sel"><input type="checkbox" class="msgSel" data-idx="'+i+'" onchange="onSelChange()" style="width:18px;height:18px"></label><div style="padding-left:22px">'+content+'</div><div class="tm">🗑️ Deleted: '+esc(fmtDT(m.deletedTime))+' • '+esc(chatTime(m))+'</div><div style="margin-top:6px"><button onclick="restoreOne('+i+')" style="background:#4caf50;color:#fff;border:none;padding:6px 12px;border-radius:14px;font-weight:bold;cursor:pointer">↩️ Wapas Lao</button></div></div>';
  });
  box.innerHTML=html;
}
function restoreOne(i){
  var m=recycleCache[i]; if(!m) return; restoreList([m]);
}
function restoreSelected(){
  var list=selectedIdx.map(function(i){return recycleCache[i];}).filter(Boolean);
  if(!list.length){alert("Pehle koi message select karo");return;}
  restoreList(list);
}
function restoreAll(){ if(!recycleCache.length){alert("Recycle khaali hai");return;} restoreList(recycleCache.slice()); }
function restoreList(list){
  list.forEach(function(m){
    var nm={id:m.id,me:(m.fromUid===myUid||m.me===true),type:m.type||"text",text:m.text||"",fname:m.fname||"",time:m.time||fmtDT(m.ts),ts:m.ts||Date.now(),fromUid:m.fromUid||myUid,fromName:m.fromName||getMyName(),toUid:friendUid,toName:friendName};
    if(_fbDb){ _fbDb.ref(chatPath()+"/"+nm.id).set(nm); _fbDb.ref(chatPathRev()+"/"+nm.id).set(nm); _fbDb.ref(recyclePath()+"/"+nm.id).remove(); }
    if(!msgsCache.some(function(x){return x.id===nm.id;})) msgsCache.push(nm);
  });
  var delSet={}; list.forEach(function(m){delSet[m.id]=true;});
  recycleCache=recycleCache.filter(function(m){return !delSet[m.id];});
  saveRecycleLocal(recycleCache); saveBackup(msgsCache);
  msgsCache.sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  alert("✅ "+list.length+" message wapas aa gaya!");
  showChat();
}
function emptyRecycle(){
  if(!recycleCache.length){alert("Recycle khaali hai");return;}
  if(!confirm("Recycle Bin hamesha ke liye khaali karein? Ye wapas nahi aayega.")) return;
  recycleCache.forEach(function(m){ if(_fbDb) _fbDb.ref(recyclePath()+"/"+m.id).remove(); });
  recycleCache=[]; saveRecycleLocal([]); renderRecycle(); alert("✅ Recycle khaali ho gaya");
}
// BLOCK / UNBLOCK
function doBlockToggle(){
  if(blockedNow){ if(_fbDb&&myUid) _fbDb.ref("blocked/"+myUid+"/"+friendUid).remove(); blockedNow=false; alert("✅ Unblock ho gaya"); }
  else{ if(!confirm(friendName+" ko Block karein?")) return; if(_fbDb&&myUid) _fbDb.ref("blocked/"+myUid+"/"+friendUid).set({name:friendName,time:Date.now()}); blockedNow=true; alert("🚫 Block ho gaya"); }
  updateHeadStatus();
}
// SEND TO GMAIL - poora chat date-time ke saath
function sendToGmail(){
  var txt=msgsCache.map(function(m){return (m.fromUid===myUid||m.me===true?"Me":friendName)+": "+(m.text||"")+"  ["+chatTime(m)+"]";}).join("\n");
  window.open("mailto:?subject="+encodeURIComponent("Chat with "+friendName)+"&body="+encodeURIComponent(txt||"Chat khaali hai"));
  if(_fbDb) _fbDb.ref("chat_exports/"+myUid).push({with:friendName,text:txt,time:Date.now()});
  alert("📧 Gmail khul gaya");
}
