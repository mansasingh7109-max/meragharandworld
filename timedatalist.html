<script>
/* UPDATE - UDSAVE: hamesha OWNER ki key me save, Website + Firebase dono me */
window.UDSAVE = (function(){
  function q(k){ try{ return new URLSearchParams(location.search).get(k)||""; }catch(e){ return ""; } }
  function myUid(){ return q("login")||q("me")||localStorage.getItem("auth_uid")||localStorage.getItem("MY_OWN_UID")||""; }
  function ownerUid(){ return q("uid")||q("cid")||q("owner")||q("id")||q("page")||sessionStorage.getItem("VIEW_OWNER_UID")||myUid(); }
  function key(b){ return b + "_" + (ownerUid()||"me"); }
  function save(base, arr){ try{ localStorage.setItem(key(base), JSON.stringify(arr)); }catch(e){} try{ if(window._fbDb && ownerUid()) window._fbDb.ref(base+"/"+ownerUid()).set(arr); }catch(e){} return arr; }
  function load(base){ try{ var v=localStorage.getItem(key(base)); if(v) return JSON.parse(v); }catch(e){} return []; }
  function saveComment(text, photo, video, tag){
    var arr = load("group_comments");
    arr.unshift({ text:text||"", photo:photo||"", video:video||"", tag:tag||"", senderUid:myUid(), senderName:"", who:"", time:Date.now(), date:new Date().toISOString().slice(0,10), privacy:"Public", boxOwner:ownerUid() });
    save("group_comments", arr);
    try{ if(window._fbDb && ownerUid()) window._fbDb.ref("group_comments/"+ownerUid()+"/messages").set(arr); }catch(e){}
    return arr;
  }
  return { myUid:myUid, ownerUid:ownerUid, key:key, save:save, load:load, saveComment:saveComment };
})();
</script>

function editMsg(el, t){
  var idx = -1;
  if(t){ for(var i=0;i<MSGS.length;i++){ if(String(MSGS[i].time)===String(t)){ idx=i; break; } } }
  if(idx===-1 && el){
    try{
      var card = el.closest(".card");
      var txt = card ? card.querySelector(".msg-name").parentNode.textContent : "";
      for(var j=0;j<MSGS.length;j++){ if(txt.indexOf(MSGS[j].text)!==-1){ idx=j; break; } }
    }catch(e){}
  }
  if(idx===-1){ alert("Ye message nahi mila, ek baar page reload karo"); return; }
  var m = MSGS[idx];
  if(m.senderUid && m.senderUid!==getMyUid() && !isOwnerNow()){ alert("🔒 Ye message tumne nahi likha, isliye Edit nahi kar sakte"); return; }
  var nw = prompt("Message Edit karo:", m.text);

  if(!nw.trim()){ alert("Khali message save nahi hoga"); return; }
  m.text = nw.trim(); m.updatedAt = Date.now(); m.edited = true;
  try{ localStorage.setItem("group_msgs_"+msgOwner(), JSON.stringify(MSGS)); }catch(e){}
  if(window._fbDb && msgOwner()) window._fbDb.ref("group_msgs/"+msgOwner()+"/messages").set(MSGS);

}

  item._from = from; item._deletedAt = Date.now(); arr.unshift(item);

  if (_fbDb && msgOwner()) _fbDb.ref("recycle_bin/" + msgOwner()).set(arr);

  var idx = -1; for (var i = 0; i < MSGS.length; i++) { if (String(MSGS[i].time) === String(t)) { idx = i; break; } }

<script>

(function(){
  function findCI(){ return document.getElementById("commentInput"); }
  var cpf = document.getElementById("commentPhotoFile");
  if(cpf){
    cpf.setAttribute("multiple","multiple");
    cpf.onchange = function(){
      var files = Array.prototype.slice.call(cpf.files || []);
      if(!files.length) return;
      var left = files.length;
      files.forEach(function(f){
        var r = new FileReader();
        r.onload = function(e){ window._pickedPhotos.push(e.target.result); left--; if(left===0){ var inp=findCI(); if(inp){ var d=document.createElement("div"); d.className="inbox-photo-preview"; d.innerHTML='<div style="font-weight:bold;color:#2e7d32;">✅ Upload Done - '+window._pickedPhotos.length+' Photo</div>'; inp.parentElement.appendChild(d); } } };
        r.readAsDataURL(f);
      });
      cpf.value = "";
    };
  }
  var cvf = document.getElementById("commentVideoFile");
  if(cvf){
    cvf.setAttribute("multiple","multiple");
    cvf.onchange = function(){
      var files = Array.prototype.slice.call(cvf.files || []);
      if(!files.length) return;
      var left = files.length;
      files.forEach(function(f){
        var r = new FileReader();
        r.onload = function(e){ window._pickedVideos.push(e.target.result); left--; if(left===0){} };
        r.readAsDataURL(f);
      });
      cvf.value = "";
    };
  }
  // Purana sendComment badlo - photo ke saath save karo
  window.sendComment = function(){
    var inp = findCI();
    var txt = inp ? inp.value.trim() : "";
    var hasMedia = (window._pickedPhotos && window._pickedPhotos.length>0) || (window._pickedVideos && window._pickedVideos.length>0);
    if(!txt && !hasMedia){ alert("Pehle Comment ya Photo/Video chuno"); return; }
    var finalText = txt || "📸 Photo";
    var arr = [];
    try{ arr = JSON.parse(localStorage.getItem("group_comments_"+msgOwner())||"[]"); }catch(e){ arr=[]; }
    // getComments() wala purana tareeka bhi try karo
    try{ if(typeof getComments==="function"){ var g=getComments(); if(g && g.length) arr=g; } }catch(e){}
    var m = { text: finalText, photo: (window._pickedPhotos&&window._pickedPhotos[0])||"", video: (window._pickedVideos&&window._pickedVideos[0])||"", photos: (window._pickedPhotos||[]).slice(), videos: (window._pickedVideos||[]).slice(), senderUid: getMyUid(), senderName: getMyName(), who: getMyName(), time: Date.now(), date: new Date().toISOString().slice(0,10), privacy:"Public", boxOwner: msgOwner(), owner: msgOwner(), type:"group_comment" };
    arr.push(m);
    try{ localStorage.setItem("group_comments_"+msgOwner(), JSON.stringify(arr)); }catch(e){}
    try{ if(typeof saveComments==="function") saveComments(arr); }catch(e){}
    try{ if(window._fbDb && msgOwner()) window._fbDb.ref("group_comments/"+msgOwner()+"/messages").set(arr); }catch(e){}
    window._pickedPhotos=[]; window._pickedVideos=[];
    document.querySelectorAll(".inbox-photo-preview").forEach(function(el){ el.remove(); });
    if(inp) inp.value="";
    try{ if(typeof showComments==="function") showComments(); }catch(e){}
    try{ if(typeof renderMessages==="function") renderMessages(); }catch(e){}
  };
})();
</script>
