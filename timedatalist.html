<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline - mera ghar and world</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#333}
#hdr{background:#e65100;color:#fff;padding:14px 16px;display:flex;align-items:center;position:sticky;top:0;z-index:10}
#hdr button{background:#fff;color:#e65100;border:none;min-width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:bold;margin-right:12px;cursor:pointer}
#hdr b{font-size:18px;flex:1}
#tabs{display:flex;background:#fff;position:sticky;top:64px;z-index:9;box-shadow:0 2px 4px rgba(0,0,0,.1)}
#tabs button{flex:1;background:none;border:none;padding:14px;font-size:15px;font-weight:bold;color:#888;border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:#e65100;border-bottom:3px solid #e65100}
#list{padding:16px;max-width:600px;margin:0 auto}
.entry{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.entry .dt{font-size:13px;color:#e65100;font-weight:bold;margin-bottom:8px}
.entry .tx{font-size:15px;color:#333;line-height:1.7;margin-bottom:8px;white-space:pre-wrap}
.entry img{width:100%;border-radius:10px;margin-top:8px}
.entry video{width:100%;border-radius:10px;margin-top:8px}
.empty{text-align:center;color:#aaa;padding:40px 20px;font-size:15px}
.sec-h{font-size:16px;font-weight:bold;color:#e65100;margin:16px 0 10px}
.pbtn{display:block;width:calc(100% - 32px);margin:12px 16px;padding:12px;border:none;border-radius:24px;font-weight:bold;font-size:14px;color:#fff;cursor:pointer;text-decoration:none;text-align:center;box-sizing:border-box}
</style>
<script>
var FIREBASE_CONFIG = { apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA", authDomain: "santramarketshoppingmall.firebaseapp.com", databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com", projectId: "santramarketshoppingmall", storageBucket: "santramarketshoppingmall.firebasestorage.app", messagingSenderId: "398490252924", appId: "1:398490252924:web:4b6f73b48d28e1c23b7bf9" };
var _fbDb=null; try{ firebase.initializeApp(FIREBASE_CONFIG); _fbDb=firebase.database(); }catch(e){}
function getUid(){ var m=location.search.match(/[?&]uid=([^&]+)/); if(m) return decodeURIComponent(m[1]); m=location.search.match(/[?&]cid=([^&]+)/); return m?decodeURIComponent(m[1]):""; }
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</head><body>
<div id="hdr"><button onclick="history.back()">←</button><b id="ttl">📅 Timeline</b></div>
  
  
    

<div id="tabs">
<button id="tD" class="on" onclick="show('d')">📝 Detail</button>
<button id="tT" onclick="show('t')">💭 Thinking</button>
<button id="tM" onclick="show('m')">💬 Messages</button>
</div>
<button class="pbtn" id="reqBtn" style="display:none;background:#25D366;" onclick="sendReq()">📩 Friend Request Bhejo</button>
<div id="list"><div class="empty">⏳ Loading...</div></div>
<script>
var _mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function _fd(d){try{var p=d.split("-");return p[2].replace(/^0/,"")+" "+_mn[parseInt(p[1])-1]+" "+p[0];}catch(e){return d;}}
function _today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');}
function _tag(dt){var t=_today();return dt<t?'📌 Past':dt===t?'🟢 Aaj':'🔮 Future';}
function _sort(arr){arr.sort(function(a,b){var x=(a.date||'')+''+(a.time||'');var y=(b.date||'')+''+(b.time||'');return x>y?-1:x<y?1:0;});return arr;}
function _load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):[];}catch(e){return[];}}

var FRIEND_DATA=null;
var FRIEND_UID=getUid();
var CUR_TAB='d';

function renderList(which){
  CUR_TAB=which;
  document.getElementById('tD').className=which==='d'?'on':'';
  document.getElementById('tT').className=which==='t'?'on':'';
  document.getElementById('tM').className=which==='m'?'on':'';
  var box=document.getElementById('list'); var h='';
  if(FRIEND_UID && FRIEND_DATA){
    // FRIEND ka timeline - Firebase se
    var name=esc(FRIEND_DATA.profileName||FRIEND_DATA.name||"Friend");
    if(which==='d'){
      var arr=_sort((FRIEND_DATA.details||[]).slice());
      // customer_details node se bhi merge
      h='<div class="sec-h">📝 Detail Timeline - '+name+' ki ('+arr.length+')</div>';
      if(arr.length===0) h+='<div class="empty">Koi detail entry nahi<br>'+name+' ne abhi detail add nahi ki</div>';
      for(var i=0;i<arr.length;i++){var e=arr[i]; h+='<div class="entry"><div class="dt">'+_tag(e.date)+' 📅 '+_fd(e.date)+'</div>'; if(e.text) h+='<div class="tx">'+esc(e.text)+'</div>'; if(e.photo) h+='<img src="'+e.photo+'">'; if(e.video) h+='<video src="'+e.video+'" controls></video>'; h+='</div>';}
    } else if(which==='t'){
      var arr2=_sort((FRIEND_DATA.thinkings||[]).slice());
      h='<div class="sec-h">💭 Thinking - '+name+' ki ('+arr2.length+')</div>';
      if(arr2.length===0) h+='<div class="empty">Koi thinking entry nahi</div>';
      for(var j=0;j<arr2.length;j++){var e2=arr2[j]; h+='<div class="entry" style="border-left:4px solid #ffc107;"><div class="dt" style="color:#f57f00;">'+_tag(e2.date)+' 📅 '+_fd(e2.date)+'</div>'; if(e2.text) h+='<div class="tx">'+esc(e2.text)+'</div>'; if(e2.photo) h+='<img src="'+e2.photo+'">'; if(e2.video) h+='<video src="'+e2.video+'" controls></video>'; h+='</div>';}
    } else {
      var arr3=_sort((FRIEND_DATA.messages||FRIEND_DATA.msgs||[]).slice());
      h='<div class="sec-h">💬 Messages - '+name+' ki ('+arr3.length+')</div>';
      if(arr3.length===0) h+='<div class="empty">Koi message nahi</div>';
      for(var k=0;k<arr3.length;k++){var e3=arr3[k]; h+='<div class="entry" style="border-left:4px solid #7b1fa2;"><div class="dt" style="color:#7b1fa2;">'+_tag(e3.date)+' 📅 '+_fd(e3.date)+'</div>'; if(e3.text) h+='<div class="tx">'+esc(e3.text)+'</div>'; if(e3.photo) h+='<img src="'+e3.photo+'">'; h+='</div>';}
    }
    box.innerHTML=h;
    return;
  }
  // OWN timeline - localStorage
  if(which==='d'){
    var arr=_sort(_load("customer_details"));
    h='<div class="sec-h">📝 Detail Timeline - Mera ('+arr.length+')</div>';
    if(arr.length===0) h+='<div class="empty">Koi detail entry nahi</div>';
    for(var i=0;i<arr.length;i++){var e=arr[i]; h+='<div class="entry"><div class="dt">'+_tag(e.date)+' 📅 '+_fd(e.date)+'</div>'; if(e.text) h+='<div class="tx">'+esc(e.text)+'</div>'; if(e.photo) h+='<img src="'+e.photo+'">'; if(e.video) h+='<video src="'+e.video+'" controls></video>'; h+='</div>';}
  } else if(which==='t'){
    var arr2=_sort(_load("customer_thinkings"));
    h='<div class="sec-h">💭 Thinking Timeline - Mera ('+arr2.length+')</div>';
    if(arr2.length===0) h+='<div class="empty">Koi thinking entry nahi</div>';
    for(var j=0;j<arr2.length;j++){var e2=arr2[j]; h+='<div class="entry" style="border-left:4px solid #ffc107;"><div class="dt" style="color:#f57f00;">'+_tag(e2.date)+' 📅 '+_fd(e2.date)+'</div>'; if(e2.text) h+='<div class="tx">'+esc(e2.text)+'</div>'; if(e2.photo) h+='<img src="'+e2.photo+'">'; h+='</div>';}
  } else {
    var arr3=_sort(_load("profile_msgs"));
    h='<div class="sec-h">💬 Messages - Mera ('+arr3.length+')</div>';
    if(arr3.length===0) h+='<div class="empty">Koi message nahi</div>';
    for(var k=0;k<arr3.length;k++){var e3=arr3[k]; h+='<div class="entry" style="border-left:4px solid #7b1fa2;"><div class="dt" style="color:#7b1fa2;">'+_tag(e3.date)+' 📅 '+_fd(e3.date)+'</div>'; if(e3.text) h+='<div class="tx">'+esc(e3.text)+'</div>'; h+='</div>';}
  }
  box.innerHTML=h;
}
function show(which){ renderList(which); }

function sendReq(){
  var uid=FRIEND_UID; var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(!myUid){alert("Pehle login karo!"); location.href="customerlogin.html"; return;}
  _fbDb.ref("friend_requests/"+uid).push({fromUid:myUid,time:Date.now(),status:"pending"},function(){ alert("✅ Request bhej di!"); });
}

if(FRIEND_UID){
  document.getElementById('ttl').textContent='📅 Friend ki Timeline';
  document.getElementById('reqBtn').style.display='block';
  _fbDb.ref("customer_profiles/"+FRIEND_UID).once("value").then(function(snap){
    var P=snap.val();
    if(!P){ document.getElementById('list').innerHTML='<div class="empty">❌ User nahi mila</div>'; return; }
   
    var isPublic=true; try{ if(P.privacy_timeline==="private" || (P.privacy && P.privacy.timelinePublic===false)) isPublic=false; }catch(e){}

    
    if(!isPublic){ document.getElementById('list').innerHTML='<div class="empty">🔒 Timeline private hai<br>'+esc(P.profileName||P.name||"User")+' ne public nahi kiya</div>'; return; }
    FRIEND_DATA=P;
    document.getElementById('ttl').textContent='📅 '+(P.profileName||P.name||"Friend")+' ki Timeline (Friend ki)';
    // extra nodes bhi load karo
    return _fbDb.ref("customer_details/"+FRIEND_UID).once("value").then(function(s2){
      var extra=[]; s2.forEach(function(ch){ extra.push(ch.val()); });
      if(extra.length>0) FRIEND_DATA.details=extra;
      return _fbDb.ref("customer_thinkings/"+FRIEND_UID).once("value").then(function(s3){
        var extra2=[]; s3.forEach(function(ch){ extra2.push(ch.val()); });
        if(extra2.length>0) FRIEND_DATA.thinkings=extra2;
        renderList('d');
      });
    });
  }).catch(function(err){ document.getElementById('list').innerHTML='<div class="empty">❌ Error: '+esc(err.message)+'</div>'; });
  

} else {
  document.getElementById('ttl').textContent='📅 Mera Timeline';
  var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(myUid && _fbDb){
    _fbDb.ref("customer_profiles/"+myUid).once("value").then(function(snap){
      var P=snap.val()||{};
      FRIEND_DATA=P;
      FRIEND_UID=myUid;
      (function(){var nm="";try{var PP=JSON.parse(localStorage.getItem("my_profile")||"{}");nm=PP.profileName||PP.name||localStorage.getItem("customer_name")||"";}catch(e){}var _u="";try{_u=localStorage.getItem("auth_uid")||"";}catch(e){}function sN(n){if(!n)return;document.getElementById('ttl').textContent='📅 '+n+' ki Timeline';}if(nm)sN(nm);if(_fbDb&&_u){_fbDb.ref("customer_profiles/"+_u).once("value").then(function(s){var P2=s.val()||{};var n2=P2.profileName||P2.name||P2.customer_name||nm;if(n2)sN(n2);});}})();
      _fbDb.ref("customer_details/"+myUid).once("value").then(function(s2){
        var extra=[]; s2.forEach(function(ch){ extra.push(ch.val()); });
        if(extra.length>0) FRIEND_DATA.details=extra;
        _fbDb.ref("customer_thinkings/"+myUid).once("value").then(function(s3){
          var extra2=[]; s3.forEach(function(ch){ extra2.push(ch.val()); });
          if(extra2.length>0) FRIEND_DATA.thinkings=extra2;
          renderList('d');
        });
      });
    });
  } else {
    renderList('d');
  }
}  
</script>
<script src="privacy.js"></script>
<script>try{PRIV_placeBtn("timelinePublic","hdr");}catch(e){}</script>

<script src="mydata.js"></script>  

<script src="headername.js"></script>  
</body></html>
