// ==== Date-Time - Sab File Ke Liye - Ek Hi Block - UPAR WALA (pehle se ban jaye isliye) ====
function fmtDT(ts){
  try{
    var d = new Date(ts || Date.now());
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"-"+mm+"-"+yy+"  "+hh+":"+mi;
  }catch(e){ return ""; }
}
function showDT(m){
  if(!m) return "";
  var t = m.time || m.createdAt || m.created || Date.now();
  var u = m.updatedAt || m.updated || m.editTime;
  if(u && u != t){ return "📅 "+fmtDT(t)+"  •  ✏️ Updated: "+fmtDT(u); }
  return "📅 "+fmtDT(t);
}
function dtHTML(m){ return "<span style='font-size:11px;color:#888;'>"+showDT(m)+"</span><br>"; }
function setNewTime(m){ m.time = Date.now(); m.updatedAt = Date.now(); return m; }
function setUpdateTime(m){ m.updatedAt = Date.now(); return m; }
</script>

<script>
function getGroupMsgs(){ try{ return JSON.parse(localStorage.getItem("group_msgs")||"[]"); }catch(e){ return []; } }
function saveGroupMsgs(a){
  localStorage.setItem("group_msgs", JSON.stringify(a));
  // Firebase me bhi save
  try{
    var u = localStorage.getItem("auth_uid") || "Manisha";
    if(_fbDb) _fbDb.ref("group_msgs/"+u).set(a);
  }catch(e){}
}
function showGroupMsgs(){
  // Cancel / Save ke baad atka hua Edit mode reset - warna agli Single Photo bhi Edit wali samajh ke gayab ho jayegi
  // NOTE: Edit khula ho tab ye call nahi hota, isliye pending safe hai
  _appendTo = -1; _pendingFor = -1; _pendingPhotos = [];
  var arr = getGroupMsgs();
  var badla = false;
  arr.forEach(function(m){
    if(!m.time){ m.time = Date.now(); m.updatedAt = Date.now(); badla = true; }
  });
  if(badla) saveGroupMsgs(arr);
  var box = document.getElementById("msgList");
  if(!box) return;
  if(!arr.length){ box.innerHTML = '<div style="color:#999;text-align:center">Koi message nahi</div>'; return; }
  box.innerHTML = "";
  // Naya upar, Purana neeche - Date-Time ke hisaab se
  var _sorted = arr.map(function(m,idx){ return {m:m, idx:idx}; });
  _sorted.sort(function(a,b){ return (b.m.time||0)-(a.m.time||0); });
  _sorted.forEach(function(_o){
    var m = _o.m; var i = _o.idx;
    var div = document.createElement("div");
    div.style = "background:#fff;padding:10px;border-radius:10px;margin:6px;";
    div.setAttribute("data-idx", i);
    var dt = "<span style='font-size:11px;color:#888;'>"+showDT(m)+"</span><br>";
    if(m.who === "Manisha"){
      div.innerHTML = (m.untitled ? "" : "<b>"+m.who+":</b> ") + "<span>"+m.text+"</span><br>" + dt +
        "<button onclick='editGroupMsg("+i+")'>✏️ Edit</button> " +
        "<button onclick='delGroupMsg("+i+")'>🗑️ Delete</button><br>" +
        "<button onclick='commentGroupMsg("+i+")'>💭 Comment</button> " +
        "<button onclick='tagFriendMsg("+i+")'>🏷️ Tag</button> " +
        "<button onclick='photoForMsg("+i+")'>📸 Photo</button> " +
        "<button onclick='videoForMsg("+i+")'>🎥 Video</button>";
    } else {
      var likes = m.likes || 0;
      div.innerHTML = (m.untitled ? "" : "<b>"+m.who+":</b> ") + "<span>"+m.text+"</span><br>" + dt +
        "<button onclick='likeGroupMsg("+i+")'>❤️ Like ("+likes+")</button> " +
        "<button onclick='commentGroupMsg("+i+")'>💭 Comment</button> " +
        "<button onclick='tagFriendMsg("+i+")'>🏷️ Tag</button> " +
        "<button onclick='photoForMsg("+i+")'>📸 Photo</button> " +
        "<button onclick='videoForMsg("+i+")'>🎥 Video</button><br>" +
        "<button onclick='hideGroupMsg("+i+")'>🙈 Hide</button> " +
        "<button onclick='hideGroupMsg("+i+")'>👎 Dislike</button>";
    }
    box.appendChild(div);
  });
}
function likeGroupMsg(i){
  var arr = getGroupMsgs();
  arr[i].likes = (arr[i].likes || 0) + 1;
  arr[i].updatedAt = Date.now();
  saveGroupMsgs(arr); showGroupMsgs();
}
function commentGroupMsg(i){
  var arr = getGroupMsgs();
  var t = prompt("Is Message pe Comment likho:", "");
  if(!t) return;
  var obj = setNewTime({who:"Manisha", text:"💭 @"+arr[i].who+" - "+t, type:"group_msg"});
  arr.push(obj); saveGroupMsgs(arr); showGroupMsgs();
}
function tagFriendMsg(i){
  var arr = getGroupMsgs();
  var name = prompt("Kisko Tag karna hai?", arr[i].who);
  if(!name) return;
  var t = prompt("Tag ke saath Message likho:", "");
  if(!t) return;
  var obj = setNewTime({who:"Manisha", text:"🏷️ @"+name+" - "+t, type:"group_msg", tag:name});
  arr.push(obj); saveGroupMsgs(arr); showGroupMsgs();
}

var _appendTo = -1;
var _pendingPhotos = [];
var _pendingFor = -1;
function photoForMsg(i){ _replyTo = i; _appendTo = -1; _pendingFor = -1; _pendingPhotos = []; document.getElementById("photoFile").click(); }
function videoForMsg(i){ _replyTo = i; _appendTo = -1; _pendingFor = -1; _pendingPhotos = []; document.getElementById("videoFile").click(); }

function sendMsg(){
  var inp = document.getElementById("msgInput");
  if(!inp) return;
  var t = inp.value.trim();
  if(!t) return;
  var arr = getGroupMsgs();
  var obj = setNewTime({who:"Manisha", text:t, type:"group_msg"});
  arr.push(obj);
  saveGroupMsgs(arr);
  inp.value = "";
  var box = document.getElementById("msgTabBox");
  if(box) box.style.display = "block";
  var list = document.getElementById("msgList");
  if(list) list.style.display = "block";
  var ty = document.getElementById("typing");
  if(ty) ty.style.display = "none";
  showGroupMsgs();
}
function tagMsg(){
  var inp = document.getElementById("msgInput");
  if(!inp) return;
  var t = inp.value.trim();
  if(!t){ alert("Pehle Message likho, fir Tag dabao!"); inp.focus(); return; }
  var name = prompt("Kisko Tag karna hai? Friend ka naam likho:", "Karishma");
  if(name === null) return;
  if(!name.trim()) name = "Friend";
  var arr = getGroupMsgs();
  var obj = setNewTime({who:"Manisha", text:"🏷️ @"+name.trim()+" - "+t, type:"group_msg", tag:name.trim()});
  arr.push(obj);
  saveGroupMsgs(arr);
  inp.value = "";
  var box = document.getElementById("msgTabBox");
  if(box) box.style.display = "block";
  showGroupMsgs();
}
function editGroupMsg(i){
  var arr = getGroupMsgs();
  var box = document.getElementById("msgList").querySelector('[data-idx="'+i+'"]');
  if(!box) return;

    "<div id='pendingBox"+i+"' style='margin:6px 0;'></div>" +
    "<span style='font-size:12px;color:#888;'>📸 Is Photo pe Message / Aur Photo jodo</span><br>" +
    '<input id="editCaption'+i+'" placeholder="Is photo pe message likho..." style="width:70%;padding:6px;"> ' +
    '<button onclick="savePhotoCaption('+i+')">✅ Save</button> ' +
    '<button onclick="showGroupMsgs()">❌ Cancel</button><br>' +
    "<button onclick='delGroupMsg("+i+")'>🗑️ Delete</button> " +
    "<button onclick='commentGroupMsg("+i+")'>💭 Comment</button> " +
    "<button onclick='tagFriendMsg("+i+")'>🏷️ Tag</button> " +
    "<button onclick='photoForEdit("+i+")'>📸 + Photo</button> " +
    "<button onclick='videoForEdit("+i+")'>🎥 + Video</button> ";
    return;
  }
  box.innerHTML = "<b>"+arr[i].who+":</b><br>" +
    "<label style='font-size:13px;'><input type='checkbox' id='untitledChk"+i+"' "+(arr[i].untitled?"checked":"")+"> Untitled - bina naam / bina title ke dikhao</label><br>" +
    "<div id='pendingBox"+i+"' style='margin:6px 0;'></div>" +
    '<input id="editInput'+i+'" value="'+arr[i].text+'" style="width:70%;padding:6px;"> ' +
    '<button onclick="saveEditMsg('+i+')">✅ Save</button> ' +
    '<button onclick="showGroupMsgs()">❌ Cancel</button><br>' +
    '<button onclick="commentGroupMsg('+i+')">💭 Comment</button> ' +
    '<button onclick="tagFriendMsg('+i+')">🏷️ Tag</button> ' +
    '<button onclick="photoForEdit('+i+')">📸 + Photo</button> ' +
    '<button onclick="videoForEdit('+i+')">🎥 + Video</button>';
}
function savePhotoCaption(i){
  var arr = getGroupMsgs();
  var el = document.getElementById("editCaption"+i);
  var v = el ? el.value.trim() : "";
  var _has = false;
  var _uc = document.getElementById("untitledChk"+i);
  if(_uc){ if(arr[i].untitled !== !!_uc.checked){ arr[i].untitled = _uc.checked; _has = true; } }
  if(v){ arr[i].text = arr[i].text + "<br><span>"+v+"</span>"; _has = true; }
  if(_pendingFor === i && _pendingPhotos.length){
    _pendingPhotos.forEach(function(u){ if(String(u).indexOf("VIDEO::")==0){ arr[i].text = arr[i].text + '<br><video src="'+u.slice(7)+'" controls style="width:260px;max-width:70%;border-radius:10px;"></video>'; } else { arr[i].text = arr[i].text + '<br><img src="'+u+'" style="width:200px;max-width:60%;border-radius:10px;">'; } });
    _has = true;
  }
  if(_has){ setUpdateTime(arr[i]); saveGroupMsgs(arr); }
  _pendingPhotos = []; _pendingFor = -1; _appendTo = -1;
  showGroupMsgs();
}
function saveEditMsg(i){
  var arr = getGroupMsgs();
  var el = document.getElementById("editInput"+i);
  if(!el) return;
  var v = el.value.trim();
  var _has2 = false;
  var _uc2 = document.getElementById("untitledChk"+i);
  if(_uc2){ arr[i].untitled = _uc2.checked; _has2 = true; }
  if(v){ arr[i].text = v; if(!arr[i].time) arr[i].time = Date.now(); _has2 = true; }
  if(_pendingFor === i && _pendingPhotos.length){
    _pendingPhotos.forEach(function(u){ if(String(u).indexOf("VIDEO::")==0){ arr[i].text = arr[i].text + '<br><video src="'+u.slice(7)+'" controls style="width:260px;max-width:70%;border-radius:10px;"></video>'; } else { arr[i].text = arr[i].text + '<br><img src="'+u+'" style="width:200px;max-width:60%;border-radius:10px;">'; } });
    _has2 = true;
  }
  if(_has2){ setUpdateTime(arr[i]); saveGroupMsgs(arr); }
  _pendingPhotos = []; _pendingFor = -1; _appendTo = -1;
  showGroupMsgs();
}
function hideGroupMsg(i){
  var arr = getGroupMsgs();
  var gaya = arr.splice(i,1)[0];
  if(!gaya) return;
  var rb = []; try{ rb = JSON.parse(localStorage.getItem("recycle_bin")||"[]"); }catch(e){}
  rb.push({type:"group_msg", data:gaya, time:Date.now()});
  localStorage.setItem("recycle_bin", JSON.stringify(rb));
  saveGroupMsgs(arr); showGroupMsgs();
}
function delGroupMsg(i){ hideGroupMsg(i); }
var _pf = document.getElementById("photoFile");
if(_pf){
  _pf.addEventListener("change", function(e){
    var files = e.target.files;

    if(_appendTo >= 0 && document.getElementById("pendingBox"+_appendTo)){
      var _idx = _appendTo;
      if(_pendingFor !== _idx){ _pendingPhotos = []; }
      _pendingFor = _idx;
      Array.prototype.forEach.call(files, function(f){
        var r = new FileReader();
        r.onload = function(){
          _pendingPhotos.push(r.result);
          var _pb = document.getElementById("pendingBox"+_idx);
          if(_pb){ _pb.innerHTML = _pendingPhotos.map(function(u){ return '<img src="'+u+'" style="width:100px;height:100px;object-fit:cover;border-radius:8px;margin:3px;">'; }).join("") + "<br><span style='font-size:11px;color:green;'>✅ "+_pendingPhotos.length+" photo select hui - Save dabao</span>"; }
        };
        r.readAsDataURL(f);
      });
      e.target.value = "";
      return;
    }
    var _replyWho = "";
    if(_replyTo >= 0){
      var _a = getGroupMsgs();
      _replyWho = _a[_replyTo] ? _a[_replyTo].who : "";
      if(_replyWho === "Manisha") _replyWho = "";
    }
    Array.prototype.forEach.call(files, function(f){
      var r = new FileReader();
      r.onload = function(){
        var arr = getGroupMsgs();
        var txt = '<img src="'+r.result+'" style="width:200px;max-width:60%;border-radius:10px;">';
        if(_replyWho){ txt = "📸 @"+_replyWho+" - " + txt; }
        arr.push({who:"Manisha", text:txt, time:Date.now(), updatedAt:Date.now(), type:"group_msg"});
        saveGroupMsgs(arr); showGroupMsgs();
      };
      r.readAsDataURL(f);
    });
    _replyTo = -1;
    e.target.value = "";
  });
}
var _vf = document.getElementById("videoFile");
if(_vf){

    var files = e.target.files; if(!files || !files.length) return;

try{

<script>
var _mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function _fd(d){try{var p=d.split("-");return p[2].replace(/^0/,"")+" "+_mn[parseInt(p[1])-1]+" "+p[0];}catch(e){return d;}}
function _today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');}
function _tag(dt){var t=_today();return dt<t?'📌 Past':dt===t?'🟢 Aaj':'🔮 Future';}
function _sort(arr){arr.sort(function(a,b){var x=(a.date||'')+''+(a.time||'');var y=(b.date||'')+''+(b.time||'');return x>y?-1:x<y?1:0;});return arr;}
function _load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):[];}catch(e){return[];}}
var FRIEND_DATA=null;
var FRIEND_UID=getUid();
var CUR_TAB='d';
function renderList(which){
  CUR_TAB=which;
  document.getElementById('tD').className=which==='d'?'on':'';
  document.getElementById('tT').className=which==='t'?'on':'';
  document.getElementById('tM').className=which==='m'?'on':'';
  var box=document.getElementById('list'); var h='';
  if(FRIEND_UID && FRIEND_DATA){
    var name=esc(FRIEND_DATA.profileName||FRIEND_DATA.name||"Friend");
    if(which==='d'){
      var arr=_sort((FRIEND_DATA.details||[]).slice());
      h='<div class="sec-h">📝 Detail Timeline - '+name+' ki ('+arr.length+')</div>';
      if(arr.length===0) h+='<div class="empty">Koi detail entry nahi<br>'+name+' ne abhi detail add nahi ki</div>';
      for(var i=0;i<arr.length;i++){var e=arr[i]; h+='<div class="entry"><div class="dt">'+_tag(e.date)+' 📅 '+_fd(e.date)+'</div>'; if(e.text) h+='<div class="tx">'+esc(e.text)+'</div>'; if(e.photo) h+='<img src="'+e.photo+'">'; if(e.video) h+='<video src="'+e.video+'" controls></video>'; h+='</div>';}
    } else if(which==='t'){
      var arr2=_sort((FRIEND_DATA.thinkings||[]).slice());
      h='<div class="sec-h">💭 Thinking - '+name+' ki ('+arr2.length+')</div>';
      if(arr2.length===0) h+='<div class="empty">Koi thinking entry nahi</div>';
      for(var j=0;j<arr2.length;j++){var e2=arr2[j]; h+='<div class="entry" style="border-left:4px solid #ffc107;"><div class="dt" style="color:#f57f00;">'+_tag(e2.date)+' 📅 '+_fd(e2.date)+'</div>'; if(e2.text) h+='<div class="tx">'+esc(e2.text)+'</div>'; if(e2.photo) h+='<img src="'+e2.photo+'">'; if(e2.video) h+='<video src="'+e2.video+'" controls></video>'; h+='</div>';}
    } else {
      var arr3=_sort((FRIEND_DATA.messages||FRIEND_DATA.msgs||[]).slice());
      h='<div class="sec-h">💬 Messages - '+name+' ki ('+arr3.length+')</div>';
      if(arr3.length===0) h+='<div class="empty">Koi message nahi</div>';
      for(var k=0;k<arr3.length;k++){var e3=arr3[k]; h+='<div class="entry" style="border-left:4px solid #7b1fa2;"><div class="dt" style="color:#7b1fa2;">'+_tag(e3.date)+' 📅 '+_fd(e3.date)+'</div>'; if(e3.text) h+='<div class="tx">'+esc(e3.text)+'</div>'; if(e3.photo) h+='<img src="'+e3.photo+'">'; h+='</div>';}
    }
    box.innerHTML=h;
    return;
  }
  if(which==='d'){
    var arr=_sort(_load("customer_details"));
    h='<div class="sec-h">📝 Detail Timeline - Mera ('+arr.length+')</div>';
    if(arr.length===0) h+='<div class="empty">Koi detail entry nahi</div>';
    for(var i=0;i<arr.length;i++){var e=arr[i]; h+='<div class="entry"><div class="dt">'+_tag(e.date)+' 📅 '+_fd(e.date)+'</div>'; if(e.text) h+='<div class="tx">'+esc(e.text)+'</div>'; if(e.photo) h+='<img src="'+e.photo+'">'; if(e.video) h+='<video src="'+e.video+'" controls></video>'; h+='</div>';}
  } else if(which==='t'){
    var arr2=_sort(_load("customer_thinkings"));
    h='<div class="sec-h">💭 Thinking Timeline - Mera ('+arr2.length+')</div>';
    if(arr2.length===0) h+='<div class="empty">Koi thinking entry nahi</div>';
    for(var j=0;j<arr2.length;j++){var e2=arr2[j]; h+='<div class="entry" style="border-left:4px solid #ffc107;"><div class="dt" style="color:#f57f00;">'+_tag(e2.date)+' 📅 '+_fd(e2.date)+'</div>'; if(e2.text) h+='<div class="tx">'+esc(e2.text)+'</div>'; if(e2.photo) h+='<img src="'+e2.photo+'">'; h+='</div>';}
  } else {
    var arr3=_sort(_load("profile_msgs"));
    h='<div class="sec-h">💬 Messages - Mera ('+arr3.length+')</div>';
    if(arr3.length===0) h+='<div class="empty">Koi message nahi</div>';
    for(var k=0;k<arr3.length;k++){var e3=arr3[k]; h+='<div class="entry" style="border-left:4px solid #7b1fa2;"><div class="dt" style="color:#7b1fa2;">'+_tag(e3.date)+' 📅 '+_fd(e3.date)+'</div>'; if(e3.text) h+='<div class="tx">'+esc(e3.text)+'</div>'; h+='</div>';}
  }
  box.innerHTML=h;
}
function show(which){
  var list = document.getElementById("list");
  var msgBox = document.getElementById("msgTabBox");
  if(which === 'm'){
    if(list) list.style.display = "none";
    if(msgBox) msgBox.style.display = "block";
  } else {
    if(list) list.style.display = "block";
    if(msgBox) msgBox.style.display = "none";
  }
  renderList(which);
  updateReqBtn();
}
function sendReq(){
  var uid=FRIEND_UID; var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(!myUid){alert("Pehle login karo!"); location.href="customerlogin.html"; return;}
  _fbDb.ref("friend_requests/"+uid).push({fromUid:myUid,time:Date.now(),status:"pending"},function(){ alert("✅ Request bhej di!"); });
}

// FIX: Friend add hai to Request button mat dikhao, Messages tab me bhi mat dikhao
function updateReqBtn(){
  var b = document.getElementById('reqBtn'); if(!b) return;
  if(!FRIEND_UID || CUR_TAB==='m'){ b.style.display='none'; return; }
  var myUid=""; try{ myUid=localStorage.getItem("auth_uid")||""; }catch(e){}
  if(!myUid || FRIEND_UID===myUid){ b.style.display='none'; return; }
  if(!_fbDb){ b.style.display='none'; return; }
  _fbDb.ref("friends/"+myUid+"/"+FRIEND_UID).once("value").then(function(s){
    if(s.val()){ b.style.display='none'; return; }
    _fbDb.ref("friend_requests_sent/"+myUid+"/"+FRIEND_UID).once("value").then(function(s2){
      if(s2.val()){ b.textContent="⏳ Request Bheji Gayi - Wait Karo"; b.style.display='block'; b.onclick=function(){}; }
      else { b.textContent="📩 Friend Request Bhejo"; b.style.display='block'; b.onclick=function(){ sendReq(); }; }
    });
  });
}  
if(FRIEND_UID){
  document.getElementById('ttl').textContent='📅 Friend ki Timeline';
  updateReqBtn();
  _fbDb.ref("customer_profiles/"+FRIEND_UID).once("value").then(function(snap){
    var P=snap.val();
    if(!P){ document.getElementById('list').innerHTML='<div class="empty">❌ User nahi mila</div>'; return; }
    var isPublic=true; try{ if(P.privacy_timeline==="private" || (P.privacy && P.privacy.timelinePublic===false)) isPublic=false; }catch(e){}
    if(!isPublic){ document.getElementById('list').innerHTML='<div class="empty">🔒 Timeline private hai<br>'+esc(P.profileName||P.name||"User")+' ne public nahi kiya</div>'; return; }
    FRIEND_DATA=P;
    document.getElementById('ttl').textContent='📅 '+(P.profileName||P.name||"Friend")+' ki Timeline (Friend ki)';
    return _fbDb.ref("customer_details/"+FRIEND_UID).once("value").then(function(s2){
      var extra=[]; s2.forEach(function(ch){ extra.push(ch.val()); });
      if(extra.length>0) FRIEND_DATA.details=extra;
      return _fbDb.ref("customer_thinkings/"+FRIEND_UID).once("value").then(function(s3){
        var extra2=[]; s3.forEach(function(ch){ extra2.push(ch.val()); });
        if(extra2.length>0) FRIEND_DATA.thinkings=extra2;
        renderList('d');
      });
    });
  }).catch(function(err){ document.getElementById('list').innerHTML='<div class="empty">❌ Error: '+esc(err.message)+'</div>'; });
} else {
  document.getElementById('ttl').textContent='📅 Mera Timeline';
  var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(myUid && _fbDb){
    _fbDb.ref("customer_profiles/"+myUid).once("value").then(function(snap){
      var P=snap.val()||{};
      FRIEND_DATA=P;
      FRIEND_UID=myUid;
      (function(){var nm="";try{var PP=JSON.parse(localStorage.getItem("my_profile")||"{}");nm=PP.profileName||PP.name||localStorage.getItem("customer_name")||"";}catch(e){}var _u="";try{_u=localStorage.getItem("auth_uid")||"";}catch(e){}function sN(n){if(!n)return;document.getElementById('ttl').textContent='📅 '+n+' ki Timeline';}if(nm)sN(nm);if(_fbDb&&_u){_fbDb.ref("customer_profiles/"+_u).once("value").then(function(s){var P2=s.val()||{};var n2=P2.profileName||P2.name||P2.customer_name||nm;if(n2)sN(n2);});}})();
      _fbDb.ref("customer_details/"+myUid).once("value").then(function(s2){
        var extra=[]; s2.forEach(function(ch){ extra.push(ch.val()); });
        if(extra.length>0) FRIEND_DATA.details=extra;
        _fbDb.ref("customer_thinkings/"+myUid).once("value").then(function(s3){
          var extra2=[]; s3.forEach(function(ch){ extra2.push(ch.val()); });
          if(extra2.length>0) FRIEND_DATA.thinkings=extra2;
          renderList('d');
        });
      });
    });
  } else {
    renderList('d');
  }
}
function syncLoginToFirebase(){
  if(!_fbDb || !myUid) return;
  _fbDb.ref("login_sessions/"+myUid).set({uid:myUid, active:true, loginAt:Date.now()});
  _fbDb.ref("login_sessions/"+myUid+"/active").on("value", function(s){
    if(s.val()===false){ localStorage.removeItem("auth_uid"); location.href='customerlogin.html'; }
  });
}

<script>
// ==== Date-Time - Sab File Ke Liye - Ek Hi Block - NEECHE WALA (old code, rakha hua) ====
function fmtDT(ts){
  try{
    var d = new Date(ts || Date.now());
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"-"+mm+"-"+yy+"  "+hh+":"+mi;
  }catch(e){ return ""; }
}
function showDT(m){
  if(!m) return "";
  var t = m.time || m.createdAt || m.created || Date.now();
  var u = m.updatedAt || m.updated || m.editTime;
  if(u && u != t){ return "📅 "+fmtDT(t)+"  •  ✏️ Updated: "+fmtDT(u); }
  return "📅 "+fmtDT(t);
}
function dtHTML(m){ return "<span style='font-size:11px;color:#888;'>"+showDT(m)+"</span><br>"; }
function setNewTime(m){ m.time = Date.now(); m.updatedAt = Date.now(); return m; }
function setUpdateTime(m){ m.updatedAt = Date.now(); return m; }
</script>
