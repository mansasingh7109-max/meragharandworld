<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accepted Dost</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head><body style="background:#FCE4EC;margin:0;font-family:Arial">

<div style="background:#4caf50;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:99">
<button onclick="history.back()" style="float:left;background:#fff;color:#4caf50;border:none;padding:6px 12px;border-radius:16px;font-weight:bold">← Wapas</button>
<b style="font-size:18px">✅ Accepted Dost</b>
<div id="accTotal" style="font-size:12px;margin-top:4px">Load ho raha hai...</div>
</div>

<input id="accSearch" placeholder="🔍 Naam likho..." oninput="loadAccepted(this.value)" style="width:calc(100% - 32px);margin:12px 16px;padding:13px;border:2px solid #4caf50;border-radius:24px;outline:none;box-sizing:border-box">

<div id="accList" style="padding:0 12px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div>

<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",authDomain:"santramarketshoppingmall.firebaseapp.com",databaseURL:"https://santramarketshoppingmall-default-rtdb.firebaseio.com",projectId:"santramarketshoppingmall",storageBucket:"santramarketshoppingmall.firebasestorage.app",messagingSenderId:"398490252924",appId:"1:398490252924:web:4b6f73b48d28e1c23b7bf9"};
try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){}
var _fbDb=firebase.database();
function myUid(){
  var m=location.search.match(/[?&]login=([^&]+)/); if(m) return decodeURIComponent(m[1]);
  return localStorage.getItem("auth_uid")||"";
}
function loadAccepted(q){
  q=(q||"").toLowerCase();
  var me=myUid();
  var acc={};
  _fbDb.ref("friends").once("value").then(function(s){
    var fr=s.val()||{};
    if(fr[me]) Object.keys(fr[me]).forEach(function(f){ acc[f]=true; });
    Object.keys(fr).forEach(function(o){ if(fr[o] && fr[o][me]) acc[o]=true; });
    return _fbDb.ref("friend_requests").once("value");
  }).then(function(s){
    var req=s.val()||{};
    Object.keys(req).forEach(function(k){
      var r=req[k]||{};
      if(r.status=="accepted"){
        if(r.to==me) acc[r.from]=true;
        if(r.from==me) acc[r.to]=true;
      }
    });
    return _fbDb.ref("customer_profiles").once("value");
  }).then(function(s){
    var val=s.val()||{};
    var h="";
    var count=0;
    Object.keys(acc).forEach(function(id){
      if(id==me) return;
      var P=val[id]||{};
      var name=P.profileName||P.name||"Friend";
      if(q && name.toLowerCase().indexOf(q)===-1) return;
      count++;
      var photo=P.profilePhoto||P.photo||"👤";
      var pic=(photo!=="👤" && (photo.indexOf("http")==0 || photo.indexOf("data:")==0)) ? '<img src="'+photo+'" style="width:100%;height:130px;object-fit:cover">' : '<div style="height:130px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:50px">👤</div>';
      h+='<div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)">'+pic
      +'<div style="padding:10px;text-align:center"><b style="color:#222;font-size:15px;">'+name+'</b><div style="background:#e8f5e9;color:#2e7d32;padding:5px;border-radius:20px;font-size:11px;font-weight:bold;margin:6px 0;">✅ Accepted Dost</div>'
      +'<button onclick="location.href=\'chat.html?uid='+id+'\'" style="background:#25D366;color:#fff;border:none;padding:8px;width:100%;border-radius:16px;font-weight:bold">💬 Chat Karo</button>'
      +'<button onclick="location.href=\'profile.html?uid='+id+'\'" style="background:#2196F3;color:#fff;border:none;padding:8px;width:100%;border-radius:16px;font-weight:bold;margin-top:4px">👤 Profile Dekho</button>'
      +'<button onclick="location.href=\'timedatalist.html?uid='+id+'\'" style="background:#E91E63;color:#fff;border:none;padding:8px;width:100%;border-radius:16px;font-weight:bold;margin-top:4px">📅 Timeline Dekho</button>'
      +'</div></div>';
    });
    document.getElementById('accTotal').textContent = count+" Accepted Dost";
    document.getElementById('accList').innerHTML = h || '<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px">Abhi koi Accepted Dost nahi hai</div>';
  }).catch(function(){ document.getElementById('accList').innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px">Load nahi hua - Internet check karo</div>'; });
}
loadAccepted("");
</script>
</body></html>
