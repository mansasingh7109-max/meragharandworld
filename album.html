<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album - mera ghar and world</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#333}
#hdr{background:#e65100;color:#fff;padding:14px 16px;display:flex;align-items:center;position:sticky;top:0;z-index:10}
#hdr button{background:#fff;color:#e65100;border:none;min-width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:bold;margin-right:12px;cursor:pointer}
#hdr b{font-size:18px;flex:1}
#grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:0 auto}
.ph{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ph img{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer}
.ph.main{grid-column:1/-1}
.ph.main img{height:280px}
.empty{text-align:center;color:#aaa;padding:40px 20px;font-size:15px;grid-column:1/-1}
#lb{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}
#lb img{max-width:95%;max-height:90%;border-radius:10px}
#lb button{position:absolute;top:16px;right:16px;background:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:bold}
.ttl{text-align:center;padding:16px 16px 0;font-size:16px;font-weight:bold;color:#e65100}
.pbtn{display:block;width:calc(100% - 32px);margin:12px 16px;padding:12px;border:none;border-radius:24px;font-weight:bold;font-size:14px;color:#fff;cursor:pointer;text-decoration:none;text-align:center;box-sizing:border-box}
</style>
<script>
var FIREBASE_CONFIG={
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional

  apiKey: "AIzaSyApXIGoX071cYEvGbfhBF69DB9Kv5YlSMA",
  authDomain: "santramarketshoppingmall.firebaseapp.com",
  databaseURL: "https://santramarketshoppingmall-default-rtdb.firebaseio.com",
  projectId: "santramarketshoppingmall",
  storageBucket: "santramarketshoppingmall.firebasestorage.app",
  messagingSenderId: "398490252924",
  appId: "1:398490252924:web:8e85fdabd76ec86e3b7bf9",
  measurementId: "G-D6079MBJ3C"

};
var _fbDb=null; try{firebase.initializeApp(FIREBASE_CONFIG); _fbDb=firebase.database();}catch(e){}
function getUid(){ var m=location.search.match(/[?&]uid=([^&]+)/); if(m) return decodeURIComponent(m[1]); m=location.search.match(/[?&]cid=([^&]+)/); return m?decodeURIComponent(m[1]):""; }
</script>
</head><body>
<div id="hdr"><button onclick="history.back()">←</button><b id="ttl">📸 Album</b></div>
  
 
  
<div class="ttl" id="cnt"></div>
<button class="pbtn" id="reqBtn" style="display:none;background:#25D366;" onclick="sendReq()">📩 Friend Request Bhejo</button>
<div id="grid"></div>
<div id="lb" onclick="this.style.display='none'"><button onclick="document.getElementById('lb').style.display='none'">✕</button><img id="lbImg" src=""></div>
<script>
function renderOwn(){
  var P={}; try{P=JSON.parse(localStorage.getItem("my_profile")||"{}");}catch(e){}
  try{ var p2=JSON.parse(localStorage.getItem("customer_profile")||"{}"); P=Object.assign(p2,P); }catch(e){}
  var photos=[];
  if(P.profilePhoto) photos.push({src:P.profilePhoto,main:true});
  if(P.photo && P.photo!==P.profilePhoto) photos.push({src:P.photo,main:false});
  for(var q=2;q<=15;q++){ var k='profilePhoto'+q; if(P[k]&&P[k]!=="") photos.push({src:P[k],main:false}); }
  (P.extraPhotos||[]).forEach(function(p){ if(p) photos.push({src:p,main:false}); });
  (function(){var nm="";try{var PP=JSON.parse(localStorage.getItem("my_profile")||"{}");nm=PP.profileName||PP.name||localStorage.getItem("customer_name")||"";}catch(e){}var _u="";try{_u=localStorage.getItem("auth_uid")||"";}catch(e){}function sN(n){if(!n)return;document.getElementById('ttl').textContent='📸 '+n+' ka Album';var b=document.querySelector('#myPrivacyBar b');if(b)b.textContent='📸 '+n+' ka Album:';}if(nm)sN(nm);if(_fbDb&&_u){_fbDb.ref("customer_profiles/"+_u).once("value").then(function(s){var P2=s.val()||{};var n2=P2.profileName||P2.name||P2.customer_name||nm;if(n2)sN(n2);});}})();
  document.getElementById('cnt').textContent='📸 Total Photos: '+photos.length;
  var grid=document.getElementById('grid');
  if(photos.length===0){ grid.innerHTML='<div class="empty">Koi photo nahi<br>Edit me jakar photo add karo</div>'; }
  else{ var h=''; for(var i=0;i<photos.length;i++){ h+='<div class="ph'+(photos[i].main?' main':'')+'"><img src="'+photos[i].src+'" onclick="openLb(this.src)"></div>'; } grid.innerHTML=h; }
}
function renderFriend(uid){
  document.getElementById('ttl').textContent="📸 Friend ka Album";
  document.getElementById('cnt').textContent="⏳ Friend ka album load ho raha hai...";
  document.getElementById('reqBtn').style.display='block';
  var myUid2=""; try{myUid2=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(uid!==myUid2 && typeof canSeeSection==="function"){
    canSeeSection(uid,'album',function(can){
      if(!can){
        document.getElementById('ttl').textContent="📸 Friend ka Album";
        document.getElementById('cnt').textContent="🔒 Album Private Hai";
        document.getElementById('grid').innerHTML='<div class="empty">🔒 Album private hai<br>Friend banne ke baad dikhega</div><div style="text-align:center"><button onclick="followUser(\''+uid+'\',function(m){alert(m);})" style="background:#7b1fa2;color:#fff;padding:12px 24px;border-radius:20px;border:none;font-weight:bold">➕ Follow</button></div>';
        return;
      }
      loadFriendAlbumData(uid);
    });
    return;
  }
  loadFriendAlbumData(uid);
}
function loadFriendAlbumData(uid){
  _fbDb.ref("customer_profiles/"+uid).once("value").then(function(snap){
    var P=snap.val()||{};
    var name=P.profileName||P.name||"Friend";
    document.getElementById('ttl').textContent="📸 "+name+" ka Album (Friend ka)";
    var photos=[];
    if(P.profilePhoto) photos.push({src:P.profilePhoto,main:true});
    if(P.photo && P.photo!==P.profilePhoto) photos.push({src:P.photo,main:false});
    for(var q=2;q<=15;q++){ var k='profilePhoto'+q; if(P[k] && P[k]!=="") photos.push({src:P[k],main:false}); }
    (P.extraPhotos||[]).forEach(function(p){ if(p) photos.push({src:p,main:false}); });
    _fbDb.ref("customer_albums/"+uid).once("value").then(function(s2){
      s2.forEach(function(ch){ var v=ch.val(); var u=""; if(v&&v.url)u=v.url; else if(typeof v==="string")u=v; else if(v&&v.photo)u=v.photo; if(u) photos.push({src:u,main:false}); });
      document.getElementById('cnt').textContent="📸 Total Photos: "+photos.length+" ("+name+" ka)";
      var grid2=document.getElementById('grid');
      if(photos.length===0){ grid2.innerHTML='<div class="empty">📸 Koi public photo nahi hai<br>'+name+' ne abhi photo add nahi ki</div>'; }
      else{ var h2=''; for(var j=0;j<photos.length;j++){ h2+='<div class="ph'+(photos[j].main?' main':'')+'"><img src="'+photos[j].src+'" onclick="openLb(this.src)"></div>'; } grid2.innerHTML=h2; }
    }).catch(function(){});
  }).catch(function(){});
}

  
function sendReq(){
  var uid=getUid(); var myUid=""; try{myUid=localStorage.getItem("auth_uid")||"";}catch(e){}
  if(!myUid){alert("Pehle login karo!"); location.href="customerlogin.html"; return;}
  _fbDb.ref("friend_requests/"+uid).push({fromUid:myUid,time:Date.now(),status:"pending"},function(){ alert("✅ Request bhej di!"); });
}
function openLb(src){document.getElementById('lbImg').src=src;document.getElementById('lb').style.display='flex';}
var fid=getUid();
if(fid){ renderFriend(fid); } else { renderOwn(); }
</script>
<script src="headername.js"></script>
<script src="mydata.js"></script>  

<script src="privacy.js"></script>
<script>try{PRIV_placeBtn("albumPublic","hdr");}catch(e){}</script>
  
</body></html>
