<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#333}
#hdr{background:#e65100;color:#fff;padding:14px 16px;display:flex;align-items:center;position:sticky;top:0;z-index:10}
#hdr button{background:#fff;color:#e65100;border:none;min-width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:bold;margin-right:12px}
#hdr b{font-size:18px}
#grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:0 auto}
.ph{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ph img{width:100%;height:180px;object-fit:cover;display:block}
.ph.main{grid-column:1/-1}
.ph.main img{height:280px}
.empty{text-align:center;color:#aaa;padding:40px 20px;font-size:15px;grid-column:1/-1}
#lb{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}
#lb img{max-width:95%;max-height:90%;border-radius:10px}
#lb button{position:absolute;top:16px;right:16px;background:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:bold}
.ttl{text-align:center;padding:16px 16px 0;font-size:16px;font-weight:bold;color:#e65100}
</style>

<script>
(function(){
var urlUid = new URLSearchParams(location.search).get('uid');
var myUid = null;
try{ myUid = localStorage.getItem("auth_uid"); }catch(e){}
var showUid = urlUid || myUid;
if(showUid && window.firebase){
  firebase.database().ref("customer_profiles/"+showUid).once("value", function(snap){
    var d = snap.val();
    if(!d) return;
    if(d.profileName){
      var el = document.getElementById('profileName');
      if(el) el.textContent = d.profileName;
    }
    if(d.profilePhoto){
      var ph = document.getElementById('profilePhoto');
      if(ph) ph.src = d.profilePhoto;
    }
    if(d.customerStatus){
      var st = document.getElementById('profileStatus');
      if(st) st.textContent = d.customerStatus;
    }
  });
}
})();
</script>


  
<div id="hdr">
<button onclick="history.back()">←</button>
<b>📸 Album</b><button onclick="location.href='customerlogin.html'" style="background:#7b1fa2;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;margin:10px;">🔐 Login</button>
</div>
<div class="ttl" id="cnt"></div>
<div id="grid"></div>
<div id="lb" onclick="this.style.display='none'">

</div>

try {
  if (FIREBASE_CONFIG.apiKey !== "TUMHARI_API_KEY") {
    firebase.initializeApp(FIREBASE_CONFIG);

  }
} catch(e) {}
// ===== FIREBASE END =====
var _p=new URLSearchParams(location.search);
var cid=_p.get('cid')||'customer1';
function _load(){try{var v=localStorage.getItem("customer_profile");return v?JSON.parse(v):{};}catch(e){return{};}}
var d=_load();
function buildPhotos(){
var photos=[];
if(d.profilePhoto)photos.push({src:d.profilePhoto,main:true});
for(var q=2;q<=15;q++){var k='profilePhoto'+q;if(d[k]&&d[k]!=="")photos.push({src:d[k],main:false});}
var grid=document.getElementById('grid');
document.getElementById('cnt').textContent='📸 Total Photos: '+photos.length;
if(photos.length===0){
grid.innerHTML='<div class="empty">Koi photo nahi<br>Edit me jakar photo add karo</div>';
}else{
var h='';
for(var i=0;i<photos.length;i++){
h+='<div class="ph'+(photos[i].main?' main':'')+'"><img src="'+photos[i].src+'" onclick="openLb(this.src)"></div>';
}
grid.innerHTML=h;
}
}
// Firebase se photos load karo (friends ke liye)
try{
if(_fbDb){
_fbDb.ref('customer_profiles/'+cid).on('value',function(snap){
var fb=snap.val();
if(fb){d=fb;buildPhotos();}
});
}
}catch(e){}
buildPhotos();
function openLb(src){document.getElementById('lbImg').src=src;document.getElementById('lb').style.display='flex';}
</script>
